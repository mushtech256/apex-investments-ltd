<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HUT 9 - Future AI Hub</title>
  <style>
    body {
      background-color: #0b132b;
      color: #ffffff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 15px;
    }
    h2 {
      text-align: center;
      color: #00b4d8;
    }
    
    /* Horizontal Series Tabs */
    .series-nav {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 10px 0;
      margin-bottom: 20px;
      scrollbar-width: none; /* Firefox */
    }
    .series-nav::-webkit-scrollbar {
      display: none; /* Chrome/Safari */
    }
    .series-btn {
      background: #1c2541;
      color: #90e0ef;
      border: 1px solid #00b4d8;
      padding: 10px 18px;
      border-radius: 20px;
      white-space: nowrap;
      font-weight: bold;
      cursor: pointer;
    }
    .series-btn.active {
      background: #00b4d8;
      color: #0b132b;
    }

    /* Vertical Machine Cards Layout */
    .machine-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .card {
      background: #1c2541;
      border-radius: 12px;
      padding: 15px;
      border: 1px solid #3a506b;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .card h3 {
      margin-top: 0;
      color: #ffffff;
    }
    .card p {
      margin: 5px 0;
      font-size: 14px;
    }
    .highlight {
      color: #ffb703;
      font-weight: bold;
    }
    .green {
      color: #38b000;
      font-weight: bold;
    }
    .buy-btn {
      width: 100%;
      background: #0077b6;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      margin-top: 10px;
      cursor: pointer;
    }
    .buy-btn:hover {
      background: #0096c7;
    }
  </style>
</head>
<body>

  <h2>🤖 AI Mining Machines</h2>

  <!-- Horizontal Scrollable Tabs -->
  <div class="series-nav" id="seriesNav"></div>

  <!-- Vertical Machines Container -->
  <div class="machine-list" id="machineList"></div>

  <script>
    let currentSeriesData = {};
    let selectedSeries = 'C-SERIES';

    async function fetchMachines() {
      try {
        const res = await fetch('/api/machines');
        currentSeriesData = await res.json();
        renderSeriesTabs();
        renderMachines(selectedSeries);
      } catch (err) {
        console.error("Failed to load machines", err);
      }
    }

    function renderSeriesTabs() {
      const nav = document.getElementById('seriesNav');
      nav.innerHTML = '';

      Object.keys(currentSeriesData).forEach(series => {
        const btn = document.createElement('button');
        btn.className = `series-btn ${series === selectedSeries ? 'active' : ''}`;
        btn.innerText = series;
        btn.onclick = () => {
          selectedSeries = series;
          renderSeriesTabs();
          renderMachines(series);
        };
        nav.appendChild(btn);
      });
    }

    function renderMachines(series) {
      const list = document.getElementById('machineList');
      list.innerHTML = '';

      const machines = currentSeriesData[series] || [];
      machines.forEach(m => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <h3>${m.name}</h3>
          <p>Price: <span class="highlight">${m.price.toLocaleString()} UGX</span></p>
          <p>Daily Return: <span class="green">+${m.daily_return.toLocaleString()} UGX</span></p>
          <p>Expiration: <span class="highlight">${m.days} Days</span></p>
          <p>Total Revenue: <span class="green">${m.total_return.toLocaleString()} UGX</span></p>
          <button class="buy-btn" onclick="buyMachine(${m.id})">Buy Machine</button>
        `;
        list.appendChild(card);
      });
    }

    async function buyMachine(id) {
      const userPhone = prompt("Enter your phone number to confirm purchase (+256...):");
      if (!userPhone) return;

      const res = await fetch('/api/buy', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone_number: userPhone, machineId: id })
      });
      const data = await res.json();
      alert(data.message || data.error);
    }

    fetchMachines();
  </script>
</body>
</html>
