<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HUT 9 - Welcome</title>
  <style>
    * { box-sizing: border-box; font-family: 'Times New Roman', Times, serif; margin: 0; padding: 0; }
    body {
      background-color: #030712;
      background-image: radial-gradient(circle at 50% 80%, #003566 0%, #030712 70%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .auth-card { width: 100%; max-width: 380px; text-align: center; }
    h1 { font-size: 36px; font-weight: bold; margin-bottom: 35px; letter-spacing: 1px; color: #ffffff; }
    
    .input-group {
      position: relative;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
    }
    .input-icon {
      position: absolute;
      left: 15px;
      font-size: 18px;
      color: #e0e0e0;
    }
    .input-toggle {
      position: absolute;
      right: 15px;
      font-size: 18px;
      cursor: pointer;
      color: #e0e0e0;
    }
    .input-field {
      width: 100%;
      padding: 14px 45px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid #2a3447;
      border-radius: 10px;
      color: #ffffff;
      font-size: 16px;
      outline: none;
      transition: border 0.3s;
    }
    .input-field:focus { border-color: #0077b6; }
    
    .lang-select {
      text-align: right;
      color: #0077b6;
      font-size: 14px;
      margin-bottom: 25px;
      cursor: pointer;
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      background: transparent;
      border: 1px solid #0077b6;
      color: #0077b6;
      font-size: 20px;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.3s;
      margin-bottom: 20px;
    }
    .btn-login:hover { background: rgba(0, 119, 182, 0.1); }

    .bottom-links {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      color: #e0e0e0;
    }
    .bottom-links span { cursor: pointer; text-decoration: none; }

    /* Dashboard Styles */
    .dashboard-container { width: 100%; max-width: 450px; background: #0b132b; border-radius: 12px; padding: 20px; border: 1px solid #1c2541; }
    .hidden { display: none; }
    .card { background: #1c2541; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #3a506b; }
    .balance { font-size: 28px; font-weight: bold; color: #48cae4; text-align: center; margin: 10px 0; }
    .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
    .btn-action { padding: 12px; background: #3a506b; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .btn-buy { width: 100%; padding: 10px; background: #0077b6; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <!-- AUTH SECTION -->
  <div id="auth-section" class="auth-card">
    <h1 id="auth-title">Welcome</h1>

    <!-- PHONE FIELD -->
    <div class="input-group">
      <span class="input-icon">📱</span>
      <input type="text" id="phone" class="input-field" placeholder="Phone Number (+256...)">
    </div>

    <!-- PASSWORD FIELD -->
    <div class="input-group">
      <span class="input-icon">🔑</span>
      <input type="password" id="password" class="input-field" placeholder="Login Password">
      <span class="input-toggle" onclick="togglePasswordVisibility()">👁️</span>
    </div>

    <div class="lang-select">English ▾</div>

    <!-- SUBMIT BUTTON -->
    <button id="auth-btn" class="btn-login" onclick="handleAuth()">Login</button>

    <!-- BOTTOM LINKS -->
    <div class="bottom-links">
      <span id="toggle-link" onclick="toggleMode()">❮ Register</span>
      <span onclick="alert('Please contact support to reset your password.')">Forgot your password?</span>
    </div>

    <p id="auth-msg" style="color: #ff4d4d; margin-top: 15px; font-size: 14px;"></p>
  </div>

  <!-- DASHBOARD SECTION -->
  <div id="dashboard" class="dashboard-container hidden">
    <h2 style="color:#0077b6; text-align:center;">HUT 9 Dashboard</h2>
    <p style="text-align:center; margin-top:5px;">User: <span id="user-phone"></span></p>
    <div class="balance"><span id="user-balance">0</span> UGX</div>

    <div class="action-grid">
      <button class="btn-action" onclick="alert('Deposit via MoMo to 0759537511')">📥 Deposit</button>
      <button class="btn-action" onclick="alert('Withdrawals open daily 8 AM - 6 PM')">📤 Withdraw</button>
    </div>

    <h3 style="margin-bottom:10px;">Available Mining Rigs</h3>
    <div id="machines-list"></div>
  </div>

<script>
  let isLoginMode = true;
  let currentUser = null;

  function togglePasswordVisibility() {
    const pwdInput = document.getElementById('password');
    pwdInput.type = pwdInput.type === 'password' ? 'text' : 'password';
  }

  function toggleMode() {
    isLoginMode = !isLoginMode;
    const title = document.getElementById('auth-title');
    const btn = document.getElementById('auth-btn');
    const toggleLink = document.getElementById('toggle-link');
    const msg = document.getElementById('auth-msg');

    msg.innerText = '';

    if (isLoginMode) {
      title.innerText = "Welcome";
      btn.innerText = "Login";
      toggleLink.innerText = "❮ Register";
    } else {
      title.innerText = "Create Account";
      btn.innerText = "Register";
      toggleLink.innerText = "❮ Login";
    }
  }

  async function handleAuth() {
    const phone_number = document.getElementById('phone').value;
    const password = document.getElementById('password').value;
    const endpoint = isLoginMode ? '/api/auth/login' : '/api/auth/register';

    const res = await fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone_number, password })
    });

    const data = await res.json();
    if (res.ok) {
      currentUser = data.user;
      loadDashboard();
    } else {
      document.getElementById('auth-msg').innerText = data.error;
    }
  }

  function loadDashboard() {
    document.getElementById('auth-section').classList.add('hidden');
    document.getElementById('dashboard').classList.remove('hidden');
    document.getElementById('user-phone').innerText = currentUser.phone_number;
    document.getElementById('user-balance').innerText = currentUser.balance.toLocaleString();
    fetchMachines();
  }

  async function fetchMachines() {
    const res = await fetch('/api/machines');
    const machines = await res.json();
    const list = document.getElementById('machines-list');
    list.innerHTML = '';

    machines.forEach(m => {
      list.innerHTML += `
        <div class="card">
          <h4>${m.name}</h4>
          <p style="color: #f2a900; margin: 5px 0;">Price: <strong>${m.price.toLocaleString()} UGX</strong></p>
          <p style="color: #48cae4; margin-bottom: 10px;">Daily: <strong>+${m.daily_return.toLocaleString()} UGX</strong></p>
          <button class="btn-buy" onclick="buyMachine(${m.id})">Buy Machine</button>
        </div>
      `;
    });
  }

  async function buyMachine(machineId) {
    const res = await fetch('/api/buy', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone_number: currentUser.phone_number, machineId })
    });

    const data = await res.json();
    if (res.ok) {
      alert(data.message);
      currentUser = data.user;
      loadDashboard();
    } else {
      alert('Error: ' + data.error);
    }
  }
</script>

</body>
</html>
