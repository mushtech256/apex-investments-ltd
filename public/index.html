<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HUT 9 Investment Platform</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
    body { background-color: #0d1b2a; color: #ffffff; padding: 20px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 450px; background: #1b263b; border-radius: 12px; padding: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
    h1, h2 { text-align: center; color: #f2a900; margin-bottom: 15px; }
    .card { background: #0d1b2a; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #415a77; }
    input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 6px; border: none; font-size: 16px; }
    button { width: 100%; padding: 12px; background: #f2a900; border: none; color: #0d1b2a; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 16px; margin-top: 5px; }
    button:hover { background: #e09f00; }
    .btn-secondary { background: #415a77; color: #fff; margin-top: 8px; }
    .btn-claim { background: #2ec4b6; color: #0d1b2a; }
    .balance { font-size: 28px; font-weight: bold; color: #2ec4b6; text-align: center; margin: 10px 0; }
    .hidden { display: none; }
    .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
    .toggle-link { color: #f2a900; text-align: center; margin-top: 15px; cursor: pointer; font-size: 14px; text-decoration: underline; }
  </style>
</head>
<body>

<div class="container">
  <h1>HUT 9</h1>

  <!-- AUTH SECTION -->
  <div id="auth-section">
    <div class="card" style="border-left: 4px solid #2ec4b6;">
      <p style="text-align: center;">🎁 <strong>Bonus: 5,000 UGX on Registration</strong></p>
    </div>
    
    <input type="text" id="phone" placeholder="Phone (+256759537511)">
    <input type="password" id="password" placeholder="Password">
    
    <!-- REGISTER BUTTON -->
    <button id="btn-register" onclick="register()">Register & Get Bonus</button>
    
    <!-- LOGIN BUTTON -->
    <button id="btn-login" class="btn-claim hidden" onclick="login()">Login to Account</button>
    
    <p id="toggle-auth" class="toggle-link" onclick="toggleAuthMode()">Already have an account? Login here</p>
    
    <p id="auth-msg" style="color: #ff6b6b; margin-top: 10px; text-align: center; font-size: 14px;"></p>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard" class="hidden">
    <p style="text-align:center;">User: <span id="user-phone"></span></p>
    <div class="balance"><span id="user-balance">0</span> UGX</div>

    <div class="action-grid">
      <button class="btn-secondary" onclick="alert('Send funds via Mobile Money to 0759537511 / 0773136149 with reference HUT9')">📥 Deposit</button>
      <button class="btn-secondary" onclick="alert('Withdrawal requests processed daily between 8 AM - 6 PM.')">📤 Withdraw</button>
    </div>

    <div id="claim-box" class="card hidden" style="border: 1px solid #2ec4b6;">
      <h3>💰 Daily Earnings Ready</h3>
      <p style="font-size: 14px; color: #e0e1dd; margin: 5px 0;">Claim today's profit from your active machines!</p>
      <button class="btn-claim" onclick="claimEarnings()">Claim Daily Profit</button>
    </div>

    <h2>Available Mining Rigs</h2>
    <div id="machines-list"></div>
  </div>
</div>

<script>
  let currentUser = null;
  let isLoginMode = false;

  function toggleAuthMode() {
    isLoginMode = !isLoginMode;
    const btnRegister = document.getElementById('btn-register');
    const btnLogin = document.getElementById('btn-login');
    const toggleLink = document.getElementById('toggle-auth');
    const authMsg = document.getElementById('auth-msg');

    authMsg.innerText = '';

    if (isLoginMode) {
      btnRegister.classList.add('hidden');
      btnLogin.classList.remove('hidden');
      toggleLink.innerText = "Don't have an account? Register here";
    } else {
      btnRegister.classList.remove('hidden');
      btnLogin.classList.add('hidden');
      toggleLink.innerText = "Already have an account? Login here";
    }
  }

  async function register() {
    const phone_number = document.getElementById('phone').value;
    const password = document.getElementById('password').value;
    
    const res = await fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone_number, password })
    });
    
    const data = await res.json();
    if (res.ok) {
      currentUser = data.user;
      loadDashboard();
    } else {
      document.getElementById('auth-msg').innerText = data.error;
    }
  }

  async function login() {
    const phone_number = document.getElementById('phone').value;
    const password = document.getElementById('password').value;
    
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone_number, password })
    });
    
    const data = await res.json();
    if (res.ok) {
      currentUser = data.user;
      loadDashboard();
    } else {
      document.getElementById('auth-msg').innerText = data.error;
    }
  }

  function loadDashboard() {
    document.getElementById('auth-section').classList.add('hidden');
    document.getElementById('dashboard').classList.remove('hidden');
    document.getElementById('user-phone').innerText = currentUser.phone_number;
    document.getElementById('user-balance').innerText = currentUser.balance.toLocaleString();

    if (currentUser.daily_earning > 0) {
      document.getElementById('claim-box').classList.remove('hidden');
    }

    fetchMachines();
  }

  async function fetchMachines() {
    const res = await fetch('/api/machines');
    const machines = await res.json();
    const list = document.getElementById('machines-list');
    list.innerHTML = '';

    machines.forEach(m => {
      list.innerHTML += `
        <div class="card">
          <h3>${m.name}</h3>
          <p style="color: #f2a900; margin: 5px 0;">Price: <strong>${m.price.toLocaleString()} UGX</strong></p>
          <p style="color: #2ec4b6; margin-bottom: 10px;">Daily Return: <strong>+${m.daily_return.toLocaleString()} UGX</strong></p>
          <button onclick="buyMachine(${m.id})">Buy Machine</button>
        </div>
      `;
    });
  }

  async function buyMachine(machineId) {
    const res = await fetch('/api/buy', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone_number: currentUser.phone_number, machineId })
    });

    const data = await res.json();
    if (res.ok) {
      alert(data.message);
      currentUser = data.user;
      loadDashboard();
    } else {
      alert('Error: ' + data.error);
    }
  }

  async function claimEarnings() {
    const res = await fetch('/api/claim', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone_number: currentUser.phone_number })
    });

    const data = await res.json();
    if (res.ok) {
      alert(data.message);
      currentUser = data.user;
      loadDashboard();
    } else {
      alert('Error: ' + data.error);
    }
  }
</script>

</body>
</html>
