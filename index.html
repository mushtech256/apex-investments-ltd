<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hut 9 Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0b0f19; color: #fff; margin: 0; padding: 0; }
        .header { background: #131b2e; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1f293d; }
        .balance { color: #00ffcc; font-weight: bold; }
        .container { padding: 15px; }
        .section-title { color: #60a5fa; margin-top: 20px; font-size: 1.1rem; }
        .card { background: #131b2e; border: 1px solid #1f293d; border-radius: 8px; padding: 12px; margin-bottom: 10px; }
        .btn { background: #3b82f6; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 8px; }
        .btn:active { background: #2563eb; }
        .nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #131b2e; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #1f293d; }
        .nav-btn { background: none; border: none; color: #9ca3af; cursor: pointer; font-size: 0.85rem; }
        .nav-btn.active { color: #3b82f6; font-weight: bold; }
        .tab-content { display: none; padding-bottom: 60px; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>

    <div class="header">
        <span>Hut 9 Dashboard</span>
        <span class="balance" id="userBalance">UGX 0</span>
    </div>

    <div class="container">
        <!-- HOME / MINING SERIES TAB -->
        <div id="homeTab" class="tab-content active">
            <div class="section-title">AI Mining Series - K-Series</div>
            
            <div class="card">
                <h3>K1 Mining Unit</h3>
                <p>Price: UGX 35000</p>
                <p>Daily: UGX 3000</p>
                <button class="btn" onclick="rentMachine('K1', 'K1 Mining Unit', 35000, 3000)">Rent</button>
            </div>

            <div class="card">
                <h3>K2 Mining Unit</h3>
                <p>Price: UGX 65000</p>
                <p>Daily: UGX 5500</p>
                <button class="btn" onclick="rentMachine('K2', 'K2 Mining Unit', 65000, 5500)">Rent</button>
            </div>
        </div>

        <!-- INCOME TAB -->
        <div id="incomeTab" class="tab-content">
            <div class="section-title">My Rented Machines & Income</div>
            <div id="rigsList">
                <p style="color: #9ca3af;">No machines rented yet.</p>
            </div>
        </div>
    </div>

    <!-- NAVIGATION BAR -->
    <div class="nav">
        <button class="nav-btn active" onclick="switchTab('home', this)">Home</button>
        <button class="nav-btn" onclick="switchTab('income', this)">Income</button>
    </div>

    <script>
        let currentUser = localStorage.getItem('phone_number') || prompt("Enter your phone number:") || "0700000000";
        localStorage.setItem('phone_number', currentUser);

        async function fetchUserData() {
            try {
                const res = await fetch(`/api/user/income?phone_number=${encodeURIComponent(currentUser)}`);
                const data = await res.json();
                if (data.success) {
                    document.getElementById('userBalance').innerText = `UGX ${data.balance.toLocaleString()}`;
                    renderRigs(data.rigs || []);
                }
            } catch (err) {
                console.error("Failed to fetch user data:", err);
            }
        }

        async function rentMachine(machineId, rigName, price, daily_return) {
            try {
                const res = await fetch('/api/user/rent', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        phone_number: currentUser,
                        machineId,
                        rigName,
                        price,
                        daily_return
                    })
                });
                const data = await res.json();
                if (data.success) {
                    alert("Rented successfully!");
                    document.getElementById('userBalance').innerText = `UGX ${data.balance.toLocaleString()}`;
                    renderRigs(data.rigs || []);
                } else {
                    alert("Rental failed: " + (data.error || "Unknown error"));
                }
            } catch (err) {
                console.error("Rent request error:", err);
                alert("Rental failed due to network error.");
            }
        }

        function renderRigs(rigs) {
            const container = document.getElementById('rigsList');
            if (!rigs || rigs.length === 0) {
                container.innerHTML = `<p style="color: #9ca3af;">No machines rented yet.</p>`;
                return;
            }
            container.innerHTML = rigs.map(rig => `
                <div class="card">
                    <h3>${rig.rigName || 'Mining Unit'}</h3>
                    <p>Cost: UGX ${(rig.price || 0).toLocaleString()}</p>
                    <p>Daily Return: UGX ${(rig.daily_return || 0).toLocaleString()}</p>
                    <p style="font-size: 0.8rem; color: #9ca3af;">Rented on: ${new Date(rig.date).toLocaleDateString()}</p>
                </div>
            `).join('');
        }

        function switchTab(tabName, btn) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            
            if (tabName === 'home') {
                document.getElementById('homeTab').classList.add('active');
            } else if (tabName === 'income') {
                document.getElementById('incomeTab').classList.add('active');
                fetchUserData();
            }
            btn.classList.add('active');
        }

        fetchUserData();
    </script>
</body>
</html>
