<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Apex Investments Ltd</title>
    <style>

            background-color: #0b1329;
            color: #ffffff;
            margin: 0;
            padding: 0;
            padding-bottom: 70px;
        }
        header {
            padding: 15px;
            font-size: 20px;
            font-weight: bold;
            background: #101935;
            border-bottom: 1px solid #1e2952;
        }
        .container {
            padding: 15px;
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #0b1329;
            border-top: 1px solid #1e2952;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 1000;
        }
        .nav-item {
            color: #94a3b8;
            text-align: center;
            font-size: 12px;
            cursor: pointer;
        }
        .nav-item.active {
            color: #38bdf8;
        }

    <header id="header-title">AI Machines</header>

    <div class="container" id="main-content">
        <!-- Dynamic content will load here -->
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchMainTab('home', this)">Home</div>
        <div class="nav-item" onclick="switchMainTab('raffle', this)">Raffle</div>
        <div class="nav-item" onclick="switchMainTab('chats', this)">Chats</div>
        <div class="nav-item" onclick="switchMainTab('ai', this)">AI</div>

</html>
