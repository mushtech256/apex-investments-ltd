<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUT 9 - Platform</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #0b132b; color: #ffffff; padding-bottom: 70px; }
        #auth-container { max-width: 400px; margin: 50px auto; padding: 20px; background: #1c2541; border-radius: 10px; }
        #auth-container h1 { text-align: center; margin-bottom: 20px; }
        .auth-tabs { display: flex; margin-bottom: 20px; }
        .auth-tabs button { flex: 1; padding: 10px; background: #3a506b; color: #fff; border: none; cursor: pointer; font-weight: bold; }
        .auth-tabs button.active { background: #00b4d8; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 14px; }
        .form-group input { width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #475569; background: #0b132b; color: #fff; }
        .auth-submit-btn { width: 100%; padding: 12px; background: #00b4d8; color: #fff; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        #main-app-content { padding: 20px; display: none; }
        #bottomNavbar { position: fixed; bottom: 0; left: 0; width: 100%; height: 60px; background: #1c2541; display: none; flex-direction: row; justify-content: space-around; align-items: center; border-top: 1px solid #3a506b; z-index: 1000; }
        .nav-item { color: #94a3b8; text-decoration: none; font-size: 11px; font-weight: bold; text-align: center; cursor: pointer; flex: 1; padding: 8px 0; }
        .nav-item.active { color: #00b4d8; }
        .card { background: #1c2541; padding: 15px; border-radius: 8px; border: 1px solid #3a506b; margin-bottom: 12px; }
        .btn-primary { width: 100%; padding: 10px; background: #00b4d8; color: #fff; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div id="auth-container">
        <h1>Welcome</h1>
        <div class="auth-tabs">
            <button id="loginTabBtn" type="button" class="active" onclick="switchAuthTab('login')">Login</button>
            <button id="registerTabBtn" type="button" onclick="switchAuthTab('register')">Register</button>
        </div>

        <form id="loginForm" onsubmit="handleAuth(event, 'Login')">
            <div class="form-group">
                <label>Phone Number (+256...)</label>
                <input type="text" id="loginPhone" placeholder="+2567xxxxxxxx" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="Enter password" required>
            </div>
            <button type="submit" class="auth-submit-btn">Login to Dashboard</button>
        </form>

        <form id="registerForm" style="display: none;" onsubmit="handleAuth(event, 'Register')">
            <div class="form-group">
                <label>Phone Number (+256...)</label>
                <input type="text" id="regPhone" placeholder="+2567xxxxxxxx" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="regPassword" placeholder="Enter password" required>
            </div>
            <button type="submit" class="auth-submit-btn">Create Account</button>
        </form>
    </div>

    <div id="main-app-content"></div>

    <div id="bottomNavbar">
        <a class="nav-item active" onclick="switchMainTab('home', this)">Home</a>
        <a class="nav-item" onclick="switchMainTab('ai', this)">AI</a>
        <a class="nav-item" onclick="switchMainTab('my', this)">My Account</a>
    </div>

    <script>
        let currentUser = { phone: '', balance: 0, wallet: 0, name: 'Mr. Rodgers' };

        function switchAuthTab(type) {
            if (type === 'login') {
                document.getElementById('loginForm').style.display = 'block';
                document.getElementById('registerForm').style.display = 'none';
                document.getElementById('loginTabBtn').classList.add('active');
                document.getElementById('registerTabBtn').classList.remove('active');
            } else {
                document.getElementById('loginForm').style.display = 'none';
                document.getElementById('registerForm').style.display = 'block';
                document.getElementById('loginTabBtn').classList.remove('active');
                document.getElementById('registerTabBtn').classList.add('active');
            }
        }

        function handleAuth(e, type) {
            e.preventDefault();
            alert(type + " successful!");
            document.getElementById('auth-container').style.display = 'none';
            document.getElementById('main-app-content').style.display = 'block';
            document.getElementById('bottomNavbar').style.display = 'flex';
            switchMainTab('home', document.querySelector('.nav-item'));
        }

        function switchMainTab(tabName, element) {
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            if (element) element.classList.add('active');
            const container = document.getElementById('main-app-content');

            if (tabName === 'home') {
                container.innerHTML = `<h2>Dashboard Home</h2><div class="card"><p>Welcome back, ${currentUser.name}!</p></div>`;
            } else if (tabName === 'ai') {
                container.innerHTML = `<h2>AI Computing</h2><div class="card"><p>Machines available for rent.</p></div>`;
            } else if (tabName === 'my') {
                container.innerHTML = `<h2>My Account</h2><div class="card"><p>Phone: ${currentUser.phone}</p></div>`;
            }
        }
    </script>
</body>
</html>
