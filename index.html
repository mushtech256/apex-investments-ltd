<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUT 9 - Platform</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #0b132b; color: #ffffff; padding-bottom: 70px; }
        #auth-container { max-width: 400px; margin: 50px auto; padding: 20px; background: #1c2541; border-radius: 10px; }
        #auth-container h1 { text-align: center; margin-bottom: 20px; }
        .auth-tabs { display: flex; margin-bottom: 20px; }
        .auth-tabs button { flex: 1; padding: 10px; background: #3a506b; color: #fff; border: none; cursor: pointer; font-weight: bold; }
        .auth-tabs button.active { background: #00b4d8; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 14px; }
        .form-group input { width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #475569; background: #0b132b; color: #fff; }
        .auth-submit-btn { width: 100%; padding: 12px; background: #00b4d8; color: #fff; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        #main-app-content { padding: 20px; display: none; }
        #bottomNavbar { position: fixed; bottom: 0; left: 0; width: 100%; height: 60px; background: #1c2541; display: none; flex-direction: row; justify-content: space-around; align-items: center; border-top: 1px solid #3a506b; z-index: 1000; }
        .nav-item { color: #94a3b8; text-decoration: none; font-size: 11px; font-weight: bold; text-align: center; cursor: pointer; flex: 1; padding: 8px 0; }
        .nav-item.active { color: #00b4d8; }
        .card { background: #1c2541; padding: 15px; border-radius: 8px; border: 1px solid #3a506b; margin-bottom: 12px; }
        .btn-primary { width: 100%; padding: 10px; background: #00b4d8; color: #fff; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 5px; }
        .grid-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
        .grid-item { background: #1c2541; padding: 12px; border-radius: 8px; border: 1px solid #3a506b; text-align: center; }
        .my-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 15px; }
        .my-btn { background: #1c2541; border: 1px solid #3a506b; padding: 12px 5px; border-radius: 8px; color: #fff; font-size: 11px; font-weight: bold; text-align: center; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 5px; }
    </style>
</head>
<body>
    <div id="auth-container">
        <h1>Welcome</h1>
        <div class="auth-tabs">
            <button id="loginTabBtn" type="button" class="active" onclick="switchAuthTab('login')">Login</button>
            <button id="registerTabBtn" type="button" onclick="switchAuthTab('register')">Register</button>
        </div>
        <form id="loginForm" onsubmit="handleAuth(event, 'Login')">
            <div class="form-group"><label>Phone Number</label><input type="text" id="loginPhone" placeholder="+2567xxxxxxxx" required></div>
            <div class="form-group"><label>Password</label><input type="password" id="loginPassword" placeholder="Enter password" required></div>
            <button type="submit" class="auth-submit-btn">Login to Dashboard</button>
        </form>
        <form id="registerForm" style="display: none;" onsubmit="handleAuth(event, 'Register')">
            <div class="form-group"><label>Phone Number</label><input type="text" id="regPhone" placeholder="+2567xxxxxxxx" required></div>
            <div class="form-group"><label>Password</label><input type="password" id="regPassword" placeholder="Enter password" required></div>
            <button type="submit" class="auth-submit-btn">Create Account</button>
        </form>
    </div>
    <div id="main-app-content"></div>
    <div id="bottomNavbar">
        <a class="nav-item active" onclick="switchMainTab('home', this)">Home</a>
        <a class="nav-item" onclick="switchMainTab('raffle', this)">Raffle</a>
        <a class="nav-item" onclick="switchMainTab('chats', this)">Chats</a>
        <a class="nav-item" onclick="switchMainTab('ai', this)">AI</a>
        <a class="nav-item" onclick="switchMainTab('income', this)">Income</a>
        <a class="nav-item" onclick="switchMainTab('my', this)">My</a>
    </div>
    <script>
        let currentUser = {
            phone: '',
            password: '',
            wallet: 0,
            balance: 0,
            depositTotal: 0,
            withdrawTotal: 0,
            aiIncomeTotal: 0,
            dailyIncomeTotal: 0,
            raffles: 0,
            name: 'Mr. Rodgers',
            avatar: '👤',
            inviteCode: ''
        };

        let userPurchasedMachines = []; 
        let userWithdrawRequests = []; 
        let depositToggle = false;

        function switchAuthTab(formType) {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const loginTabBtn = document.getElementById('loginTabBtn');
            const registerTabBtn = document.getElementById('registerTabBtn');

            if (formType === 'login') {
                loginForm.style.display = 'block';
                registerForm.style.display = 'none';
                loginTabBtn.classList.add('active');
                registerTabBtn.classList.remove('active');
            } else {
                loginForm.style.display = 'none';
                registerForm.style.display = 'block';
                loginTabBtn.classList.remove('active');
                registerTabBtn.classList.add('active');
            }
        }

        function handleAuth(e, type) {
            e.preventDefault();
            const isLogin = type === 'Login';
            const phone = document.getElementById(isLogin ? 'loginPhone' : 'regPhone').value;
            const password = document.getElementById(isLogin ? 'loginPassword' : 'regPassword').value;

            currentUser.phone = phone;
            currentUser.password = password;
            currentUser.inviteCode = `https://hut9-platform.onrender.com/?ref=${phone}`;

            alert(isLogin ? "Login successful!" : "Account created successfully!");
            document.getElementById('auth-container').style.display = 'none';
            document.getElementById('main-app-content').style.display = 'block';
            document.getElementById('bottomNavbar').style.display = 'flex';
            
            switchMainTab('home', document.querySelector('.nav-item'));
        }

        const aiMachinesData = [
            { id: 'H1', series: 'H', name: 'H1 Tractor Machine (1X)', price: 30000, daily: 3000, days: 30, total: 3000 * 30 },
            { id: 'H2', series: 'H', name: 'H2 Tractor Machine (2X)', price: 100000, daily: 10000, days: 30, total: 10000 * 30 },
            { id: 'H3', series: 'H', name: 'H3 Tractor Machine (3X)', price: 250000, daily: 21000, days: 30, total: 21000 * 30 },
            { id: 'H4', series: 'H', name: 'H4 Tractor Machine (4X)', price: 300000, daily: 28000, days: 30, total: 28000 * 30 },
            { id: 'H5', series: 'H', name: 'H5 Tractor Machine (5X)', price: 500000, daily: 35000, days: 30, total: 35000 * 30 },

            { id: 'D1', series: 'D', name: 'D1 Mining Unit (1X)', price: 150000, daily: 50000, days: 15, total: 50000 * 15 },
            { id: 'D2', series: 'D', name: 'D2 Mining Unit (2X)', price: 350000, daily: 75000, days: 15, total: 75000 * 15 },
            { id: 'D3', series: 'D', name: 'D3 Mining Unit (3X)', price: 600000, daily: 100000, days: 15, total: 100000 * 15 },
            { id: 'D4', series: 'D', name: 'D4 Mining Unit (4X)', price: 800000, daily: 150000, days: 15, total: 150000 * 15 },
            { id: 'D5', series: 'D', name: 'D5 Mining Unit (5X)', price: 1000000, daily: 200000, days: 15, total: 200000 * 15 },

            { id: 'G1', series: 'G', name: 'G1 Grid Unit (1X)', price: 200000, daily: 15000, days: 20, total: 15000 * 20 },
            { id: 'G2', series: 'G', name: 'G2 Grid Unit (2X)', price: 400000, daily: 32000, days: 20, total: 32000 * 20 },
            { id: 'G3', series: 'G', name: 'G3 Grid Unit (3X)', price: 700000, daily: 60000, days: 20, total: 60000 * 20 },
            { id: 'G4', series: 'G', name: 'G4 Grid Unit (4X)', price: 950000, daily: 85000, days: 20, total: 85000 * 20 },
            { id: 'G5', series: 'G', name: 'G5 Grid Unit (5X)', price: 1200000, daily: 110000, days: 20, total: 110000 * 20 },

            { id: 'Z1', series: 'Z', name: 'Z1 Quantum Rig (1X)', price: 500000, daily: 50000, days: 7, total: 50000 * 7 },
            { id: 'Z2', series: 'Z', name: 'Z2 Quantum Rig (2X)', price: 850000, daily: 150000, days: 7, total: 150000 * 7 },
            { id: 'Z3', series: 'Z', name: 'Z3 Quantum Rig (3X)', price: 1000000, daily: 400000, days: 7, total: 400000 * 7 },
            { id: 'Z4', series: 'Z', name: 'Z4 Quantum Rig (4X)', price: 1500000, daily: 450000, days: 7, total: 450000 * 7 },
            { id: 'Z5', series: 'Z', name: 'Z5 Quantum Rig (5X)', price: 2000000, daily: 500000, days: 7, total: 500000 * 7 },

            { id: 'V1', series: 'VIP', name: 'VIP 1 Elite Core (1X)', price: 2500000, daily: 25000, days: 100, total: 25000 * 100 },
            { id: 'V2', series: 'VIP', name: 'VIP 2 Elite Core (2X)', price: 4000000, daily: 35000, days: 100, total: 35000 * 100 },
            { id: 'V3', series: 'VIP', name: 'VIP 3 Elite Core (3X)', price: 6000000, daily: 100000, days: 100, total: 100000 * 100 },
            { id: 'V4', series: 'VIP', name: 'VIP 4 Elite Core (4X)', price: 8000000, daily: 190000, days: 100, total: 190000 * 100 },
            { id: 'V5', series: 'VIP', name: 'VIP 5 Elite Core (5X)', price: 10000000, daily: 250000, days: 100, total: 250000 * 100 }
        ];

        function switchMainTab(tabName, element) {
            const navItems = document.querySelectorAll('.nav-item');
            navItems.forEach(item => item.classList.remove('active'));
            if (element) element.classList.add('active');

            const mainContent = document.getElementById('main-app-content');
            
            if (tabName === 'home') renderHomeTab(mainContent);
            else if (tabName === 'raffle') renderRaffleTab(mainContent);
            else if (tabName === 'chats') renderChatsTab(mainContent);
            else if (tabName === 'ai') renderAiDashboard('All');
            else if (tabName === 'income') renderIncomeTab(mainContent);
            else if (tabName === 'my') renderMyTab(mainContent);
        }
        function renderHomeTab(container) {
            let withdrawList = userWithdrawRequests.length === 0 ? '<p style="font-size: 12px; color: #94a3b8;">0</p>' : '';
            userWithdrawRequests.forEach((w, idx) => {
                let cancelBtn = w.status === 'Pending' ? `<br><span style="color: #ef4444; cursor: pointer; font-size: 11px; text-decoration: underline;" onclick="cancelWithdraw(${idx})">Cancel</span>` : '';
                withdrawList += `<p style="font-size: 12px; color: #38bdf8;">UGX ${w.amount.toLocaleString()} - <strong>${w.status}</strong>${cancelBtn}</p>`;
            });

            let totalIncomeAll = userPurchasedMachines.reduce((sum, m) => sum + (m.status === 'Collected' ? m.total : 0), 0);
            let dailySumAll = userPurchasedMachines.filter(m => m.status === 'Running').reduce((sum, m) => sum + m.daily, 0);

            container.innerHTML = `
                <h2 style="color: #00b4d8; margin-bottom: 5px;">Welcome, ${currentUser.name}</h2>
                <p style="font-size: 13px; color: #94a3b8; margin-bottom: 12px;">HUT 9 Platform Dashboard</p>
                
                <div style="display: flex; gap: 8px; overflow-x: auto; margin-bottom: 15px; padding-bottom: 5px;">
                    <img src="https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?w=300" style="width: 140px; height: 90px; object-fit: cover; border-radius: 6px; border: 1px solid #3a506b;">
                    <img src="https://images.unsplash.com/photo-1531482615713-2afd69097998?w=300" style="width: 140px; height: 90px; object-fit: cover; border-radius: 6px; border: 1px solid #3a506b;">
                    <img src="https://images.unsplash.com/photo-1518770660439-4636190af475?w=300" style="width: 140px; height: 90px; object-fit: cover; border-radius: 6px; border: 1px solid #3a506b;">
                </div>

                <div class="grid-stats">
                    <div class="grid-item"><span style="font-size: 11px; color: #94a3b8;">Deposit details</span><p style="font-size: 15px; font-weight: bold; color: #10b981; margin-top: 4px;">UGX ${currentUser.depositTotal.toLocaleString()}</p></div>
                    <div class="grid-item"><span style="font-size: 11px; color: #94a3b8;">Withdraw details</span><div style="margin-top: 4px;">${withdrawList}</div></div>
                    <div class="grid-item"><span style="font-size: 11px; color: #94a3b8;">All income</span><p style="font-size: 15px; font-weight: bold; color: #38bdf8; margin-top: 4px;">UGX ${totalIncomeAll.toLocaleString()}</p></div>
                    <div class="grid-item"><span style="font-size: 11px; color: #94a3b8;">Daily income</span><p style="font-size: 15px; font-weight: bold; color: #38bdf8; margin-top: 4px;">UGX ${dailySumAll.toLocaleString()}</p></div>
                </div>
            `;
        }

        function cancelWithdraw(idx) {
            const w = userWithdrawRequests[idx];
            if (w.status !== 'Pending') return;
            currentUser.balance += w.amount;
            w.status = 'Cancelled';
            alert(`Withdrawal cancelled. UGX ${w.amount.toLocaleString()} returned to Account Balance.`);
            renderHomeTab(document.getElementById('main-app-content'));
        }

        function renderRaffleTab(container) {
            container.innerHTML = `<h2>Raffle Rewards</h2><div class="card" style="margin-top: 15px; text-align: center;"><p>Purchase machines to earn raffle bonuses!</p><p style="font-weight: bold; color: #10b981; margin-top: 10px;">Total Raffles: ${currentUser.raffles}</p></div>`;
        }

        function renderChatsTab(container) {
            container.innerHTML = `
                <h2>Customer Support</h2>
                <div class="card" style="margin-top: 15px; text-align: center;">
                    <p style="font-size: 14px; color: #94a3b8; margin-bottom: 15px;">24/7 Online Customer Service</p>
                    <a href="https://t.me/hut9uganda" target="_blank" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: #229ED9; color: #fff; padding: 12px 20px; border-radius: 6px; text-decoration: none; font-weight: bold;">
                        <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.562 8.161c-.18 1.897-.962 6.502-1.359 8.627-.168.9-.5 1.201-.82 1.23-.697.064-1.228-.461-1.901-.903-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.911.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.482-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.324-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635.099-.002.321.023.465.14.12.098.153.228.166.331.011.104.024.339.011.523z"/></svg>
                        Join Telegram Group
                    </a>
                </div>
            `;
        }

        function renderAiDashboard(filterSeries) {
            const mainContent = document.getElementById('main-app-content');
            const seriesList = ['All', 'H', 'D', 'G', 'Z', 'VIP'];
            let buttonsHtml = '<div style="display: flex; gap: 5px; overflow-x: auto; margin-bottom: 15px;">';
            seriesList.forEach(s => {
                const activeStyle = filterSeries === s ? 'background: #00b4d8; color: #fff;' : 'background: #1c2541; color: #94a3b8;';
                buttonsHtml += `<button onclick="renderAiDashboard('${s}')" style="padding: 8px 12px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; ${activeStyle}">${s}</button>`;
            });
            buttonsHtml += '</div>';

            const filtered = filterSeries === 'All' ? aiMachinesData : aiMachinesData.filter(m => m.series === filterSeries);
            let machinesHtml = '';
            filtered.forEach(m => {
                machinesHtml += `
                    <div class="card">
                        <h3 style="color: #00b4d8; font-size: 15px;">${m.name}</h3>
                        <p style="font-size: 13px; margin: 3px 0;">Price: UGX ${m.price.toLocaleString()}</p>
                        <p style="font-size: 13px; margin: 3px 0;">Daily: <strong style="color: #10b981;">UGX ${m.daily.toLocaleString()}</strong></p>
                        <p style="font-size: 12px; color: #94a3b8; margin: 3px 0;">Cycle: ${m.days} Days</p>
                        <button class="btn-primary" onclick="buyMachine('${m.id}')">Rent Machine</button>
                    </div>
                `;
            });
            mainContent.innerHTML = `<h2>AI Machines</h2>${buttonsHtml}${machinesHtml}`;
        }

        function buyMachine(id) {
            const m = aiMachinesData.find(item => item.id === id);
            if (currentUser.wallet < m.price) {
                alert("Insufficient funds in wallet!");
                return;
            }
            currentUser.wallet -= m.price;
            currentUser.raffles += 1;
            userPurchasedMachines.push({ 
                name: m.name, 
                price: m.price, 
                total: m.total, 
                daysTotal: m.days, 
                daysPassed: 1, 
                status: 'Running' 
            });
            alert(`Successfully rented ${m.name}!`);
            switchMainTab('income', document.querySelectorAll('.nav-item')[4]);
        }

        function renderIncomeTab(container) {
            let list = userPurchasedMachines.length === 0 ? '<p style="color: #94a3b8;">No machines rented.</p>' : '';
            userPurchasedMachines.forEach((m, idx) => {
                let canCollect = m.daysPassed >= m.daysTotal && m.status === 'Running';
                let btnHtml = canCollect ? 
                    `<button class="btn-primary" style="background: #10b981;" onclick="receiveIncome(${idx})">Receive Income (UGX ${m.total.toLocaleString()})</button>` :
                    `<p style="font-size: 12px; color: #38bdf8; margin-top: 8px;">Status: ${m.status} (${m.daysPassed}/${m.daysTotal} Days)</p>`;

                list += `
                    <div class="card">
                        <h3 style="font-size: 15px; color: #00b4d8;">${m.name}</h3>
                        <p style="font-size: 13px; margin: 3px 0;">Total Return: UGX ${m.total.toLocaleString()}</p>
                        ${btnHtml}
                    </div>
                `;
            });
            container.innerHTML = `<h2>My Machines</h2>${list}`;
        }

        function receiveIncome(idx) {
            const m = userPurchasedMachines[idx];
            m.status = 'Collected';
            currentUser.balance += m.total;
            alert(`Cycle complete! UGX ${m.total.toLocaleString()} added to Account Balance.`);
            renderIncomeTab(document.getElementById('main-app-content'));
        }

        function renderMyTab(container) {
            container.innerHTML = `
                <h2>My Account</h2>
                <div class="card" style="display: flex; align-items: center; gap: 10px; margin-top: 15px;">
                    <span style="font-size: 30px;">${currentUser.avatar}</span>
                    <div><h3>${currentUser.name}</h3><p style="font-size: 13px; color: #94a3b8;">${currentUser.phone}</p></div>
                </div>
                <div class="my-grid">
                    <button class="my-btn" onclick="renderDepositView()"><span>💳</span> Deposit</button>
                    <button class="my-btn" onclick="renderWalletView()"><span>💰</span> Wallet</button>
                    <button class="my-btn" onclick="renderWithdrawView()"><span>🏦</span> Withdraw</button>
                    <button class="my-btn" onclick="renderInviteView()"><span>🔗</span> Invite</button>
                    <button class="my-btn" onclick="alert('App download ready.')"><span>📥</span> App</button>
                    <button class="my-btn" onclick="renderSettingsView()"><span>⚙️</span> Settings</button>
                </div>
            `;
        }

        function renderDepositView() {
            document.getElementById('main-app-content').innerHTML = `
                <h2>Deposit</h2>
                <div class="card" style="margin-top: 15px;">
                    <div class="form-group"><label>Phone Number</label><input type="text" id="depPhone" placeholder="Enter phone"></div>
                    <div class="form-group"><label>Amount (UGX)</label><input type="number" id="depAmount" placeholder="Amount"></div>
                    <button class="btn-primary" onclick="processDepositContinue()">CONTINUE</button>
                    <button class="btn-primary" style="background: #3a506b;" onclick="renderMyTab(document.getElementById('main-app-content'))">Back</button>
                </div>
            `;
        }

        function processDepositContinue() {
            const amt = parseFloat(document.getElementById('depAmount').value);
            if (!amt || amt <= 0) { alert("Enter valid amount"); return; }
            depositToggle = !depositToggle;
            const phone = depositToggle ? "0773539696" : "0795160094";
            const name = depositToggle ? "NEMA KISA" : "JOSEPH BYABASAIJA";

            document.getElementById('main-app-content').innerHTML = `
                <h2>Send Payment</h2>
                <div class="card" style="margin-top: 15px; text-align: center;">
                    <p>Send UGX ${amt.toLocaleString()} to:</p>
                    <p style="font-size: 20px; color: #00b4d8; font-weight: bold; margin: 10px 0;">${phone}</p>
                    <p style="font-size: 16px; color: #10b981; font-weight: bold;">${name}</p>
                    <button class="btn-primary" onclick="navigator.clipboard.writeText('${phone} ${name}'); alert('Copied!');">Copy details</button>
                    <button class="btn-primary" style="background: #10b981; margin-top: 10px;" onclick="simulateDeposit(${amt})">I Have Sent Money</button>
                    <button class="btn-primary" style="background: #3a506b;" onclick="renderMyTab(document.getElementById('main-app-content'))">Back</button>
                </div>
            `;
        }

        function simulateDeposit(amt) {
            currentUser.wallet += amt;
            currentUser.depositTotal += amt;
            alert(`Payment detected! UGX ${amt.toLocaleString()} added to Wallet.`);
            renderWalletView();
        }

        function renderWalletView() {
            document.getElementById('main-app-content').innerHTML = `
                <h2>Wallet & Balance</h2>
                <div class="card" style="margin-top: 15px;">
                    <p style="color: #94a3b8; font-size: 13px;">Wallet Balance (For Machines)</p>
                    <p style="font-size: 22px; color: #10b981; font-weight: bold; margin: 5px 0 15px 0;">UGX ${currentUser.wallet.toLocaleString()}</p>
                    <p style="color: #94a3b8; font-size: 13px;">Account Balance (From Income)</p>
                    <p style="font-size: 22px; color: #38bdf8; font-weight: bold; margin: 5px 0 15px 0;">UGX ${currentUser.balance.toLocaleString()}</p>
                    <button class="btn-primary" style="background: #3a506b;" onclick="renderMyTab(document.getElementById('main-app-content'))">Back</button>
                </div>
            `;
        }

        function renderWithdrawView() {
            document.getElementById('main-app-content').innerHTML = `
                <h2>Withdraw</h2>
                <div class="card" style="margin-top: 15px;">
                    <div class="form-group"><label>Phone Number</label><input type="text" id="wPhone"></div>
                    <div class="form-group"><label>Names</label><input type="text" id="wName"></div>
                    <div class="form-group"><label>Amount</label><input type="number" id="wAmount"></div>
                    <button class="btn-primary" onclick="processWithdraw()">Confirm Withdrawal</button>
                    <button class="btn-primary" style="background: #3a506b;" onclick="renderMyTab(document.getElementById('main-app-content'))">Back</button>
                </div>
            `;
        }

        function processWithdraw() {
            const phone = document.getElementById('wPhone').value;
            const amt = parseFloat(document.getElementById('wAmount').value);
            if (!amt || currentUser.balance < amt) { alert("Invalid amount or insufficient balance"); return; }
            currentUser.balance -= amt;
            userWithdrawRequests.push({ phone, amount: amt, status: 'Pending' });
            alert("Withdrawal requested!");
            switchMainTab('home', document.querySelectorAll('.nav-item')[0]);
        }

        function renderInviteView() {
            document.getElementById('main-app-content').innerHTML = `
                <h2>Invite Friends</h2>
                <div class="card" style="margin-top: 15px;">
                    <p style="font-size: 13px; color: #94a3b8; margin-bottom: 10px;">Earn UGX 3,000 when your invitee deposits & rents a machine!</p>
                    <div class="form-group"><input type="text" id="invLink" value="${currentUser.inviteCode}" readonly></div>
                    <button class="btn-primary" onclick="navigator.clipboard.writeText(document.getElementById('invLink').value); alert('Link copied!');">Copy Link</button>
                    <button class="btn-primary" style="background: #3a506b;" onclick="renderMyTab(document.getElementById('main-app-content'))">Back</button>
                </div>
            `;
        }

        function renderSettingsView() {
            document.getElementById('main-app-content').innerHTML = `
                <h2>Settings</h2>
                <div class="card" style="margin-top: 15px;">
                    <div class="form-group"><label>Name</label><input type="text" id="setName" value="${currentUser.name}"></div>
                    <button class="btn-primary" onclick="currentUser.name = document.getElementById('setName').value; alert('Updated!');">Save Name</button>
                    <hr style="border-color: #3a506b; margin: 15px 0;">
                    <h3 style="font-size: 14px; margin-bottom: 10px;">Reset Password</h3>
                    <div class="form-group"><label>Last Password (Old)</label><input type="password" id="oldPass"></div>
                    <div class="form-group"><label>Current / New Password</label><input type="password" id="newPass"></div>
                    <div class="form-group"><label>Confirm Password</label><input type="password" id="confPass"></div>
                    <button class="btn-primary" onclick="updatePassword()">Update Password</button>
                    <button class="btn-primary" style="background: #3a506b;" onclick="renderMyTab(document.getElementById('main-app-content'))">Back</button>
                </div>
            `;
        }

        function updatePassword() {
            const oldP = document.getElementById('oldPass').value;
            const newP = document.getElementById('newPass').value;
            const confP = document.getElementById('confPass').value;
            if (oldP !== currentUser.password) { alert("Incorrect old password!"); return; }
            if (newP !== confP) { alert("Passwords do not match!"); return; }
            currentUser.password = newP;
            alert("Password updated successfully!");
            renderMyTab(document.getElementById('main-app-content'));
        }
    </script>
</body>
</html>
