<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hut 9 - AI Mining & Investments</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0b1329; color: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background: #101935; border-bottom: 1px solid #1e2952; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; }
        header h1 { font-size: 18px; color: #38bdf8; font-weight: 700; }
        #main-container { flex: 1; overflow-y: auto; padding-bottom: 80px; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #101935; border-top: 1px solid #1e2952; display: flex; justify-content: space-around; padding: 8px 0; z-index: 1000; }
        .nav-item { text-align: center; color: #94a3b8; font-size: 10px; cursor: pointer; background: none; border: none; flex: 1; text-decoration: none; }
        .nav-item.active { color: #38bdf8; font-weight: bold; }
        .nav-item span { display: block; font-size: 16px; margin-bottom: 2px; }
        .card { background: #101935; border: 1px solid #1e2952; border-radius: 12px; padding: 16px; margin: 15px; }
        .btn { width: 100%; background: #0284c7; color: #fff; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-success { background: #10b981; }
        .btn-danger { background: #ef4444; }
        input, select { width: 100%; padding: 10px; margin-top: 6px; margin-bottom: 14px; background: #0b1329; border: 1px solid #1e2952; color: #fff; border-radius: 6px; }
        label { font-size: 12px; color: #cbd5e1; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .sub-box { background: #0b1329; border: 1px solid #1e2952; padding: 12px; border-radius: 8px; text-align: center; }
        .sub-box h4 { font-size: 11px; color: #94a3b8; margin-bottom: 5px; }
        .sub-box p { font-size: 14px; color: #34d399; font-weight: bold; }
        .my-horizontal { display: flex; justify-content: space-around; background: #0b1329; border: 1px solid #1e2952; padding: 15px; border-radius: 8px; margin-top: 15px; text-align: center; cursor: pointer; }
        .my-horizontal div { flex: 1; font-size: 12px; color: #38bdf8; font-weight: bold; }
    </style>
</head>
<body>
    <header>
        <h1 id="header-title">Hut 9</h1>
        <div id="header-balance" style="font-size: 13px; color: #34d399; font-weight: bold;"></div>
    </header>
    <div id="main-container"></div>
    <nav class="bottom-nav" id="bottom-nav" style="display: none;">
        <button class="nav-item active" onclick="switchTab('home', this)"><span>🏠</span>Home</button>
        <button class="nav-item" onclick="switchTab('raffle', this)"><span>🎁</span>Raffle</button>
        <button class="nav-item" onclick="switchTab('chat', this)"><span>💬</span>Chat</button>
        <button class="nav-item" onclick="switchTab('ai', this)"><span>🤖</span>AI</button>
        <button class="nav-item" onclick="switchTab('income', this)"><span>📊</span>Income</button>
        <button class="nav-item" onclick="switchTab('my', this)"><span>👤</span>My</button>
    </nav>
    <script>
        let currentUser = JSON.parse(localStorage.getItem('hut9_active_user')) || null;
        const machines = [
            { id: 1, name: 'H1 Miner (1X)', price: 200000, payout: 15000, cycle: 20 },
            { id: 2, name: 'H2 Miner (2X)', price: 400000, payout: 32000, cycle: 20 },
            { id: 3, name: 'D1 Mining Unit', price: 500000, payout: 50000, cycle: 7 },
            { id: 4, name: 'Z1 Quantum Rig', price: 1500000, payout: 160000, cycle: 30 }
        ];

        window.onload = () => initApp();

        function generateCode() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let code = 'HUT9-';
            for (let i = 0; i < 6; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
            return code;
        }

        function initApp() {
            const nav = document.getElementById('bottom-nav');
            const balanceEl = document.getElementById('header-balance');
            if (!currentUser) {
                nav.style.display = 'none';
                balanceEl.innerText = '';
                renderLogin();
            } else {
                nav.style.display = 'flex';
                balanceEl.innerText = `UGX ${(currentUser.balance || 0).toLocaleString()}`;
                if (!currentUser.inviteCode) { currentUser.inviteCode = generateCode(); saveUserData(); }
                switchTab('home', document.querySelector('.nav-item'));
            }
        }

        function saveUserData() {
            localStorage.setItem('hut9_active_user', JSON.stringify(currentUser));
            let users = JSON.parse(localStorage.getItem('hut9_users_db')) || [];
            let index = users.findIndex(u => u.phone === currentUser.phone);
            if (index !== -1) { users[index] = currentUser; localStorage.setItem('hut9_users_db', JSON.stringify(users)); }
            document.getElementById('header-balance').innerText = `UGX ${currentUser.balance.toLocaleString()}`;
        }

        function renderLogin() {
            document.getElementById('header-title').innerText = 'Hut 9 - Access';
            document.getElementById('main-container').innerHTML = `
                <div class="card" style="max-width: 400px; margin: 40px auto;">
                    <h2 style="color: #38bdf8; text-align: center;">Welcome Back</h2>
                    <label>Phone Number</label><input type="text" id="login-phone" placeholder="Enter phone">
                    <label>Password</label><input type="password" id="login-pass" placeholder="Enter password">
                    <button class="btn" onclick="handleLogin()">Login</button>
                    <button class="btn" style="background: transparent; border: 1px solid #1e2952; color: #38bdf8;" onclick="renderRegister()">Create Account</button>
                </div>`;
        }

        function renderRegister() {
            document.getElementById('header-title').innerText = 'Hut 9 - Register';
            document.getElementById('main-container').innerHTML = `
                <div class="card" style="max-width: 400px; margin: 40px auto;">
                    <h2 style="color: #38bdf8; text-align: center;">Register</h2>
                    <label>Full Name</label><input type="text" id="reg-name" placeholder="Enter name">
                    <label>Phone Number</label><input type="text" id="reg-phone" placeholder="Enter phone">
                    <label>Password</label><input type="password" id="reg-pass" placeholder="Create password">
                    <button class="btn btn-success" onclick="handleRegister()">Register Account</button>
                    <button class="btn" style="background: transparent; border: 1px solid #1e2952; color: #38bdf8;" onclick="renderLogin()">Back to Login</button>
                </div>`;
        }

        function handleRegister() {
            const name = document.getElementById('reg-name').value;
            const phone = document.getElementById('reg-phone').value;
            const pass = document.getElementById('reg-pass').value;
            if (!name || !phone || !pass) { alert('Please fill in all fields.'); return; }
            let users = JSON.parse(localStorage.getItem('hut9_users_db')) || [];
            if (users.some(u => u.phone === phone)) { alert('Account already exists!'); renderLogin(); return; }
            currentUser = { name, phone, pass, balance: 15000, rigs: [], deposits: [], withdrawals: [], inviteCode: generateCode() };
            users.push(currentUser);
            localStorage.setItem('hut9_users_db', JSON.stringify(users));
            localStorage.setItem('hut9_active_user', JSON.stringify(currentUser));
            alert('Registration successful! UGX 15,000 bonus added.');
            initApp();
        }

        function handleLogin() {
            const phone = document.getElementById('login-phone').value;
            const pass = document.getElementById('login-pass').value;
            let users = JSON.parse(localStorage.getItem('hut9_users_db')) || [];
            const foundUser = users.find(u => u.phone === phone && u.pass === pass);
            if (foundUser) {
                currentUser = foundUser;
                if(!currentUser.rigs) currentUser.rigs = [];
                if(!currentUser.deposits) currentUser.deposits = [];
                if(!currentUser.withdrawals) currentUser.withdrawals = [];
                if(!currentUser.inviteCode) currentUser.inviteCode = generateCode();
                localStorage.setItem('hut9_active_user', JSON.stringify(currentUser));
                initApp();
            } else { alert('Invalid credentials.'); }
        }

        function switchTab(tabName, element) {
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            if (element) element.classList.add('active');
            const container = document.getElementById('main-container'), title = document.getElementById('header-title');

            if (tabName === 'home') {
                title.innerText = 'Hut 9 Dashboard';
                let totalDep = currentUser.deposits?.reduce((sum, d) => sum + d.amount, 0) || 0;
                let totalWit = currentUser.withdrawals?.reduce((sum, w) => sum + w.amount, 0) || 0;
                let aiInc = currentUser.rigs?.reduce((sum, r) => sum + r.payout, 0) || 0;
                let dailyEarn = currentUser.rigs?.length > 0 ? aiInc : 0;

                container.innerHTML = `
                    <div class="card" style="padding: 10px; text-align: center;">
                        <img src="https://images.unsplash.com/photo-1592982537447-7440770cbfc9?auto=format&fit=crop&w=600&q=80" style="width:100%; height:140px; object-fit:cover; border-radius:8px;" alt="Tractors">
                    </div>
                    <div class="card">
                        <h3 style="color:#38bdf8; margin-bottom:10px;">Portfolio Metrics</h3>
                        <div class="grid-2">
                            <div class="sub-box">
                                <h4>Deposit details</h4>
                                <p>UGX ${totalDep.toLocaleString()}</p>
                            </div>
                            <div class="sub-box">
                                <h4>Withdraw details</h4>
                                <p>UGX ${totalWit.toLocaleString()}</p>
                            </div>
                            <div class="sub-box">
                                <h4>Ai income</h4>
                                <p>UGX ${aiInc.toLocaleString()}</p>
                            </div>
                            <div class="sub-box">
                                <h4>Daily earnings</h4>
                                <p>UGX ${dailyEarn.toLocaleString()}</p>
                            </div>
                        </div>
                    </div>`;
            } else if (tabName === 'raffle') {
                title.innerText = 'Lucky Raffle';
                container.innerHTML = `
                    <div class="card" style="text-align:center;">
                        <h3>Spin & Win (Cost: UGX 2,000)</h3>
                        <div id="spin-result" style="font-size:16px;margin:15px 0;color:#34d399;">Ready?</div>
                        <button class="btn" onclick="spinWheel()">Spin</button>
                    </div>`;
            } else if (tabName === 'chat') {
                title.innerText = 'Support Chat';
                container.innerHTML = `
                    <div class="card" style="text-align:center; padding: 40px 20px;">
                        <h3 style="color:#38bdf8; margin-bottom:15px;">Connect with us on Telegram</h3>
                        <p style="font-size:13px; color:#cbd5e1; margin-bottom:20px;">Tap the Telegram logo below to join our official community channel.</p>
                        <a href="https://t.me/hut9uganda" target="_blank" style="display:inline-block; background:#229ED9; color:#fff; padding:15px 30px; border-radius:50px; text-decoration:none; font-weight:bold; font-size:16px;">
                            💬 Open Telegram Channel
                        </a>
                    </div>`;
            } else if (tabName === 'ai') {
                title.innerText = 'AI Mining Rigs';
                container.innerHTML = machines.map(m => `
                    <div class="card">
                        <h3 style="color:#38bdf8;">${m.name}</h3>
                        <p style="font-size:13px;color:#cbd5e1;">Price: UGX ${m.price.toLocaleString()}</p>
                        <p style="font-size:13px;color:#34d399;">Daily Payout: UGX ${m.payout.toLocaleString()}</p>
                        <button class="btn" onclick="rentRig(${m.id})">Rent Rig</button>
                    </div>`).join('');
            } else if (tabName === 'income') {
                title.innerText = 'Income Overview';
                container.innerHTML = `<div class="card"><h3 style="color:#38bdf8;">Earnings Breakdown</h3><p style="font-size:13px;color:#cbd5e1;margin-top:10px;">All active automated income streams are credited daily.</p></div>`;
            } else if (tabName === 'my') {
                title.innerText = 'My Dashboard';
                container.innerHTML = `
                    <div class="card">
                        <h3 style="color:#38bdf8;text-align:center;">${currentUser.name}</h3>
                        <p style="text-align:center;color:#34d399;font-weight:bold;margin-bottom:15px;">UGX ${currentUser.balance.toLocaleString()}</p>
                        
                        <div class="my-horizontal">
                            <div onclick="renderSubMenu('deposit')">Deposit</div>
                            <div onclick="renderSubMenu('withdraw')">Withdraw</div>
                            <div onclick="renderSubMenu('invite')">Invite</div>
                            <div onclick="renderSubMenu('settings')">Settings</div>
                        </div>

                        <button class="btn btn-danger" style="margin-top:25px;" onclick="logout()">Logout</button>
                    </div>`;
            }
        }

        let intervalId = null;
        function renderSubMenu(sub) {
            if (intervalId) clearInterval(intervalId);
            const container = document.getElementById('main-container'), title = document.getElementById('header-title');

            if (sub === 'deposit') {
                title.innerText = 'Deposit';
                container.innerHTML = `
                    <div class="card">
                        <button class="btn" style="background:transparent;border:1px solid #1e2952;color:#38bdf8;margin-bottom:10px;" onclick="switchTab('my', document.querySelectorAll('.nav-item')[5])">← Back</button>
                        <label>Phone Number</label><input type="text" id="dep-phone" value="${currentUser.phone}">
                        <label>Amount (UGX)</label><input type="number" id="dep-amt" placeholder="Enter amount">
                        <button class="btn btn-success" onclick="goToPaymentPage()">CONTINUE</button>
                    </div>`;
            } else if (sub === 'withdraw') {
                title.innerText = 'Withdraw';
                container.innerHTML = `
                    <div class="card">
                        <button class="btn" style="background:transparent;border:1px solid #1e2952;color:#38bdf8;margin-bottom:10px;" onclick="switchTab('my', document.querySelectorAll('.nav-item')[5])">← Back</button>
                        <label>Amount (UGX)</label><input type="number" id="wit-amt" placeholder="Enter amount">
                        <button class="btn btn-danger" onclick="processWithdraw()">Submit Request</button>
                    </div>`;
            } else if (sub === 'invite') {
                title.innerText = 'Invite Friends';
                const link = `https://hut9.onrender.com/?ref=${currentUser.inviteCode}`;
                container.innerHTML = `
                    <div class="card" style="text-align:center;">
                        <button class="btn" style="background:transparent;border:1px solid #1e2952;color:#38bdf8;margin-bottom:10px;" onclick="switchTab('my', document.querySelectorAll('.nav-item')[5])">← Back</button>
                        <label>Your Code</label><input type="text" readonly value="${currentUser.inviteCode}" style="text-align:center;color:#34d399;">
                        <label>Link</label><input type="text" readonly value="${link}" style="text-align:center;font-size:10px;">
                        <button class="btn btn-success" onclick="navigator.clipboard.writeText('${link}');alert('Copied!');">Copy Link</button>
                    </div>`;
            } else if (sub === 'settings') {
                title.innerText = 'Settings';
                container.innerHTML = `
                    <div class="card">
                        <button class="btn" style="background:transparent;border:1px solid #1e2952;color:#38bdf8;margin-bottom:10px;" onclick="switchTab('my', document.querySelectorAll('.nav-item')[5])">← Back</button>
                        <label>Name</label><input type="text" id="set-name" value="${currentUser.name}">
                        <button class="btn" onclick="currentUser.name=document.getElementById('set-name').value;saveUserData();alert('Updated!');switchTab('my', document.querySelectorAll('.nav-item')[5])">Save</button>
                    </div>`;
            }
        }

        let pendingDepositAmount = 0;
        function goToPaymentPage() {
            const amt = parseInt(document.getElementById('dep-amt').value);
            if (!amt || amt <= 0) { alert('Please enter a valid amount.'); return; }
            pendingDepositAmount = amt;
            
            const container = document.getElementById('main-container');
            document.getElementById('header-title').innerText = 'Make Payment';

            const numbers = [
                { name: 'NEMA KISA', phone: '0773539696' },
                { name: 'JOSEPH BYABASAIJA', phone: '0795160094' }
            ];
            let idx = 0;

            container.innerHTML = `
                <div class="card" style="text-align:center;">
                    <h3 style="color:#38bdf8; margin-bottom:10px;">Send UGX ${amt.toLocaleString()} to:</h3>
                    <div id="payment-target" style="background:#0b1329; border:1px solid #1e2952; padding:15px; border-radius:8px; margin:15px 0;">
                        <p style="font-size:18px; color:#34d399; font-weight:bold;" id="pay-phone">${numbers[0].phone}</p>
                        <p style="font-size:14px; color:#cbd5e1;" id="pay-name">${numbers[0].name}</p>
                    </div>
                    <p style="font-size:11px; color:#94a3b8; margin-bottom:15px;">Number rotates automatically. Send money, then paste your transaction ID below.</p>
                    <label>Transaction ID / Message</label>
                    <input type="text" id="trx-id" placeholder="Paste transaction message here">
                    <button class="btn btn-success" onclick="confirmDeposit()">Confirm Deposit</button>
                </div>`;

            intervalId = setInterval(() => {
                idx = (idx + 1) % numbers.length;
                const pEl = document.getElementById('pay-phone');
                const nEl = document.getElementById('pay-name');
                if (pEl && nEl) {
                    pEl.innerText = numbers[idx].phone;
                    nEl.innerText = numbers[idx].name;
                }
            }, 5000);
        }

        function confirmDeposit() {
            const trx = document.getElementById('trx-id').value;
            if (!trx) { alert('Please paste the transaction ID/message.'); return; }
            if (intervalId) clearInterval(intervalId);

            currentUser.balance += pendingDepositAmount;
            currentUser.deposits = currentUser.deposits || [];
            currentUser.deposits.push({ amount: pendingDepositAmount, trx, date: new Date().toLocaleDateString() });
            saveUserData();

            alert('Deposit confirmed successfully and added to your balance!');
            switchTab('home', document.querySelectorAll('.nav-item')[0]);
        }

        function rentRig(id) {
            const rig = machines.find(m => m.id === id);
            if (currentUser.balance < rig.price) { alert('Insufficient balance!'); renderSubMenu('deposit'); return; }
            currentUser.balance -= rig.price;
            currentUser.rigs = currentUser.rigs || [];
            currentUser.rigs.push(rig);
            saveUserData();
            alert(`Rented ${rig.name}!`);
            switchTab('home', document.querySelectorAll('.nav-item')[0]);
        }

        function processWithdraw() {
            const amt = parseInt(document.getElementById('wit-amt').value);
            if (!amt || amt <= 0 || amt > currentUser.balance) { alert('Invalid or insufficient balance'); return; }
            currentUser.balance -= amt;
            currentUser.withdrawals = currentUser.withdrawals || [];
            currentUser.withdrawals.push({ amount: amt, date: new Date().toLocaleDateString() });
            saveUserData();
            alert('Withdrawal request submitted successfully!');
            switchTab('home', document.querySelectorAll('.nav-item')[0]);
        }

        function spinWheel() {
            if (currentUser.balance < 2000) { alert('Need at least 2,000 UGX'); return; }
            currentUser.balance -= 2000;
            const prize = [0, 1000, 3000, 5000, 15000, 50000][Math.floor(Math.random() * 6)];
            currentUser.balance += prize;
            saveUserData();
            document.getElementById('spin-result').innerText = prize > 0 ? `Won UGX ${prize.toLocaleString()}!` : 'No win!';
        }

        function logout() { 
            if (intervalId) clearInterval(intervalId);
            localStorage.removeItem('hut9_active_user'); 
            currentUser = null; 
            initApp(); 
        }
    </script>
</body>
</html>
