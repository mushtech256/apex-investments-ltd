<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hut 9 - AI Mining & Investments</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0b1329; color: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background: #101935; border-bottom: 1px solid #1e2952; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; }
        header h1 { font-size: 18px; color: #38bdf8; font-weight: 700; }
        #main-container { flex: 1; overflow-y: auto; padding-bottom: 80px; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #101935; border-top: 1px solid #1e2952; display: flex; justify-content: space-around; padding: 8px 0; z-index: 1000; }
        .nav-item { text-align: center; color: #94a3b8; font-size: 10px; cursor: pointer; background: none; border: none; flex: 1; text-decoration: none; }
        .nav-item.active { color: #38bdf8; font-weight: bold; }
        .nav-item span { display: block; font-size: 16px; margin-bottom: 2px; }
        .card { background: #101935; border: 1px solid #1e2952; border-radius: 12px; padding: 16px; margin: 15px; }
        .btn { width: 100%; background: #0284c7; color: #fff; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-success { background: #10b981; }
        .btn-danger { background: #ef4444; }
        .btn-warning { background: #f59e0b; color: #000; }
        input, select { width: 100%; padding: 10px; margin-top: 6px; margin-bottom: 14px; background: #0b1329; border: 1px solid #1e2952; color: #fff; border-radius: 6px; }
        label { font-size: 12px; color: #cbd5e1; }
        .badge { display: inline-block; padding: 4px 8px; font-size: 11px; font-weight: bold; border-radius: 4px; background: #1e2952; color: #38bdf8; }
        .menu-row { display: flex; justify-content: space-between; background: #0b1329; padding: 12px; border-radius: 8px; margin-bottom: 8px; border: 1px solid #1e2952; cursor: pointer; align-items: center; }
    </style>
</head>
<body>
    <header>
        <h1 id="header-title">Hut 9</h1>
        <div id="header-balance" style="font-size: 13px; color: #34d399; font-weight: bold;"></div>
    </header>
    <div id="main-container"></div>
    <nav class="bottom-nav" id="bottom-nav" style="display: none;">
        <button class="nav-item active" onclick="switchTab('home', this)"><span>🏠</span>Home</button>
        <button class="nav-item" onclick="switchTab('ai', this)"><span>🤖</span>AI Rigs</button>
        <button class="nav-item" onclick="switchTab('raffle', this)"><span>🎁</span>Raffle</button>
        <button class="nav-item" onclick="switchTab('my', this)"><span>👤</span>My</button>
        <a class="nav-item" href="https://t.me/hut9uganda" target="_blank"><span>💬</span>Chat</a>
    </nav>
    <script>
        let currentUser = JSON.parse(localStorage.getItem('hut9_active_user')) || null;
        const machines = [
            { id: 1, name: 'H1 Miner (1X)', price: 200000, payout: 15000, cycle: '20 Days' },
            { id: 2, name: 'H2 Miner (2X)', price: 400000, payout: 32000, cycle: '20 Days' },
            { id: 3, name: 'D1 Mining Unit', price: 500000, payout: 50000, cycle: '7 Days' },
            { id: 4, name: 'Z1 Quantum Rig', price: 1500000, payout: 160000, cycle: '30 Days' }
        ];

        window.onload = () => initApp();

        function generateAlphaNumericCode() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let code = 'HUT9-';
            for (let i = 0; i < 6; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
            return code;
        }

        function initApp() {
            const nav = document.getElementById('bottom-nav');
            const balanceEl = document.getElementById('header-balance');
            if (!currentUser) {
                nav.style.display = 'none';
                balanceEl.innerText = '';
                renderLogin();
            } else {
                nav.style.display = 'flex';
                balanceEl.innerText = `UGX ${(currentUser.balance || 0).toLocaleString()}`;
                if (!currentUser.inviteCode) { currentUser.inviteCode = generateAlphaNumericCode(); saveUserData(); }
                switchTab('home', document.querySelector('.nav-item'));
            }
        }

        function saveUserData() {
            localStorage.setItem('hut9_active_user', JSON.stringify(currentUser));
            let users = JSON.parse(localStorage.getItem('hut9_users_db')) || [];
            let index = users.findIndex(u => u.phone === currentUser.phone);
            if (index !== -1) { users[index] = currentUser; localStorage.setItem('hut9_users_db', JSON.stringify(users)); }
            document.getElementById('header-balance').innerText = `UGX ${currentUser.balance.toLocaleString()}`;
        }

        function renderLogin() {
            document.getElementById('header-title').innerText = 'Hut 9 - Access';
            document.getElementById('main-container').innerHTML = `
                <div class="card" style="max-width: 400px; margin: 40px auto;">
                    <h2 style="color: #38bdf8; text-align: center;">Welcome Back</h2>
                    <label>Phone Number</label><input type="text" id="login-phone" placeholder="Enter phone">
                    <label>Password</label><input type="password" id="login-pass" placeholder="Enter password">
                    <button class="btn" onclick="handleLogin()">Login</button>
                    <button class="btn" style="background: transparent; border: 1px solid #1e2952; color: #38bdf8;" onclick="renderRegister()">Create Account</button>
                </div>`;
        }

        function renderRegister() {
            document.getElementById('header-title').innerText = 'Hut 9 - Register';
            document.getElementById('main-container').innerHTML = `
                <div class="card" style="max-width: 400px; margin: 40px auto;">
                    <h2 style="color: #38bdf8; text-align: center;">Register</h2>
                    <label>Full Name</label><input type="text" id="reg-name" placeholder="Enter name">
                    <label>Phone Number</label><input type="text" id="reg-phone" placeholder="Enter phone">
                    <label>Password</label><input type="password" id="reg-pass" placeholder="Create password">
                    <button class="btn btn-success" onclick="handleRegister()">Register Account</button>
                    <button class="btn" style="background: transparent; border: 1px solid #1e2952; color: #38bdf8;" onclick="renderLogin()">Back to Login</button>
                </div>`;
        }

        function handleRegister() {
            const name = document.getElementById('reg-name').value;
            const phone = document.getElementById('reg-phone').value;
            const pass = document.getElementById('reg-pass').value;
            if (!name || !phone || !pass) { alert('Please fill in all fields.'); return; }
            let users = JSON.parse(localStorage.getItem('hut9_users_db')) || [];
            if (users.some(u => u.phone === phone)) { alert('Account already exists!'); renderLogin(); return; }
            currentUser = { name, phone, pass, balance: 15000, rigs: [], inviteCode: generateAlphaNumericCode() };
            users.push(currentUser);
            localStorage.setItem('hut9_users_db', JSON.stringify(users));
            localStorage.setItem('hut9_active_user', JSON.stringify(currentUser));
            alert('Registration successful! UGX 15,000 bonus added.');
            initApp();
        }

        function handleLogin() {
            const phone = document.getElementById('login-phone').value;
            const pass = document.getElementById('login-pass').value;
            let users = JSON.parse(localStorage.getItem('hut9_users_db')) || [];
            const foundUser = users.find(u => u.phone === phone && u.pass === pass);
            if (foundUser) {
                currentUser = foundUser;
                if(!currentUser.rigs) currentUser.rigs = [];
                if(!currentUser.inviteCode) currentUser.inviteCode = generateAlphaNumericCode();
                localStorage.setItem('hut9_active_user', JSON.stringify(currentUser));
                initApp();
            } else { alert('Invalid credentials.'); }
        }

        function switchTab(tabName, element) {
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            if (element) element.classList.add('active');
            const container = document.getElementById('main-container'), title = document.getElementById('header-title');

            if (tabName === 'home') {
                title.innerText = 'Hut 9 Dashboard';
                let rigsHtml = currentUser.rigs?.length ? currentUser.rigs.map(r => `<p style="color:#34d399;font-size:13px;">✔ ${r.name}</p>`).join('') : '<p style="color:#94a3b8;font-size:13px;">No active rigs.</p>';
                container.innerHTML = `
                    <div class="card" style="background:linear-gradient(135deg, #0284c7, #1e1b4b);"><h2>Hello, ${currentUser.name}</h2></div>
                    <div class="card"><h3>Balance: UGX ${currentUser.balance.toLocaleString()}</h3><hr style="margin:10px 0;border-color:#1e2952;"><h4 style="font-size:14px;color:#cbd5e1;">Your Rigs</h4>${rigsHtml}</div>`;
            } else if (tabName === 'ai') {
                title.innerText = 'AI Mining Rigs';
                container.innerHTML = machines.map(m => `
                    <div class="card">
                        <h3 style="color:#38bdf8;">${m.name}</h3>
                        <p style="font-size:13px;color:#cbd5e1;">Price: UGX ${m.price.toLocaleString()}</p>
                        <p style="font-size:13px;color:#34d399;">Daily: UGX ${m.payout.toLocaleString()}</p>
                        <button class="btn" onclick="rentRig(${m.id})">Rent Rig</button>
                    </div>`).join('');
            } else if (tabName === 'raffle') {
                title.innerText = 'Lucky Raffle';
                container.innerHTML = `
                    <div class="card" style="text-align:center;">
                        <h3>Spin & Win (Cost: UGX 2,000)</h3>
                        <div id="spin-result" style="font-size:16px;margin:15px 0;color:#34d399;">Ready?</div>
                        <button class="btn" onclick="spinWheel()">Spin</button>
                    </div>`;
            } else if (tabName === 'my') {
                title.innerText = 'My Dashboard';
                container.innerHTML = `
                    <div class="card" style="max-width:400px;margin:20px auto;">
                        <h3 style="color:#38bdf8;text-align:center;">${currentUser.name}</h3>
                        <p style="text-align:center;color:#34d399;font-weight:bold;margin-bottom:15px;">UGX ${currentUser.balance.toLocaleString()}</p>
                        <div class="menu-row" onclick="renderSubMenu('deposit')"><span>💳 Deposit</span><span>➔</span></div>
                        <div class="menu-row" onclick="renderSubMenu('withdraw')"><span>💸 Withdraw</span><span>➔</span></div>
                        <div class="menu-row" onclick="renderSubMenu('invite')"><span>🔗 Invite Friends</span><span>➔</span></div>
                        <div class="menu-row" onclick="renderSubMenu('settings')"><span>⚙ Settings</span><span>➔</span></div>
                        <button class="btn btn-danger" style="margin-top:20px;" onclick="logout()">Logout</button>
                    </div>`;
            }
        }

        function renderSubMenu(sub) {
            const container = document.getElementById('main-container'), title = document.getElementById('header-title');
            if (sub === 'deposit') {
                title.innerText = 'Deposit';
                container.innerHTML = `<div class="card"><button class="btn" style="background:transparent;border:1px solid #1e2952;color:#38bdf8;margin-bottom:10px;" onclick="switchTab('my', document.querySelectorAll('.nav-item')[3])">← Back</button><label>Amount (UGX)</label><input type="number" id="dep-amount"><button class="btn btn-success" onclick="processDeposit()">Confirm</button></div>`;
            } else if (sub === 'withdraw') {
                title.innerText = 'Withdraw';
                container.innerHTML = `<div class="card"><button class="btn" style="background:transparent;border:1px solid #1e2952;color:#38bdf8;margin-bottom:10px;" onclick="switchTab('my', document.querySelectorAll('.nav-item')[3])">← Back</button><label>Amount (UGX)</label><input type="number" id="wit-amount"><button class="btn btn-warning" onclick="processWithdraw()">Submit</button></div>`;
            } else if (sub === 'invite') {
                title.innerText = 'Invite Friends';
                const link = `https://hut9.onrender.com/?ref=${currentUser.inviteCode}`;
                container.innerHTML = `<div class="card" style="text-align:center;"><button class="btn" style="background:transparent;border:1px solid #1e2952;color:#38bdf8;margin-bottom:10px;" onclick="switchTab('my', document.querySelectorAll('.nav-item')[3])">← Back</button><label>Your Code</label><input type="text" readonly value="${currentUser.inviteCode}" style="text-align:center;color:#34d399;"><label>Link</label><input type="text" readonly value="${link}" style="text-align:center;font-size:10px;"><button class="btn btn-success" onclick="navigator.clipboard.writeText('${link}');alert('Copied!');">Copy Link</button></div>`;
            } else if (sub === 'settings') {
                title.innerText = 'Settings';
                container.innerHTML = `<div class="card"><button class="btn" style="background:transparent;border:1px solid #1e2952;color:#38bdf8;margin-bottom:10px;" onclick="switchTab('my', document.querySelectorAll('.nav-item')[3])">← Back</button><label>Name</label><input type="text" id="set-name" value="${currentUser.name}"><button class="btn" onclick="currentUser.name=document.getElementById('set-name').value;saveUserData();alert('Updated!');switchTab('my', document.querySelectorAll('.nav-item')[3])">Save</button></div>`;
            }
        }

        function rentRig(id) {
            const rig = machines.find(m => m.id === id);
            if (currentUser.balance < rig.price) { alert('Insufficient balance!'); renderSubMenu('deposit'); return; }
            currentUser.balance -= rig.price;
            currentUser.rigs = currentUser.rigs || [];
            currentUser.rigs.push(rig);
            saveUserData();
            alert(`Rented ${rig.name}!`);
            switchTab('home', document.querySelector('.nav-item'));
        }

        function processDeposit() {
            const amt = parseInt(document.getElementById('dep-amount').value);
            if (!amt || amt <= 0) { alert('Enter valid amount'); return; }
            currentUser.balance += amt;
            saveUserData();
            alert('Deposit successful!');
            switchTab('my', document.querySelectorAll('.nav-item')[3]);
        }

        function processWithdraw() {
            const amt = parseInt(document.getElementById('wit-amount').value);
            if (!amt || amt > currentUser.balance) { alert('Invalid or insufficient balance'); return; }
            currentUser.balance -= amt;
            saveUserData();
            alert('Withdrawal requested!');
            switchTab('my', document.querySelectorAll('.nav-item')[3]);
        }

        function spinWheel() {
            if (currentUser.balance < 2000) { alert('Need at least 2,000 UGX'); return; }
            currentUser.balance -= 2000;
            const prize = [0, 1000, 3000, 5000, 15000, 50000][Math.floor(Math.random() * 6)];
            currentUser.balance += prize;
            saveUserData();
            document.getElementById('spin-result').innerText = prize >  0 ? `Won UGX ${prize.toLocaleString()}!` : 'No win!';
        }

        function logout() { localStorage.removeItem('hut9_active_user'); currentUser = null; initApp(); }
    </script>
</body>
</html>
