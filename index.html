<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hut 9 - AI Mining & Investments</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0b1329; color: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background: #101935; border-bottom: 1px solid #1e2952; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; }
        header h1 { font-size: 18px; color: #38bdf8; font-weight: 700; }
        #main-container { flex: 1; overflow-y: auto; padding-bottom: 80px; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #101935; border-top: 1px solid #1e2952; display: flex; justify-content: space-around; padding: 8px 0; z-index: 1000; }
        .nav-item { text-align: center; color: #94a3b8; font-size: 10px; cursor: pointer; background: none; border: none; flex: 1; text-decoration: none; }
        .nav-item.active { color: #38bdf8; font-weight: bold; }
        .nav-item span { display: block; font-size: 16px; margin-bottom: 2px; }
        .card { background: #101935; border: 1px solid #1e2952; border-radius: 12px; padding: 14px; margin: 10px 15px; }
        .btn { width: 100%; background: #0284c7; color: #fff; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 8px; font-size: 12px; }
        .btn-success { background: #10b981; }
        .btn-danger { background: #ef4444; }
        input, select { width: 100%; padding: 10px; margin-top: 6px; margin-bottom: 14px; background: #0b1329; border: 1px solid #1e2952; color: #fff; border-radius: 6px; }
        label { font-size: 12px; color: #cbd5e1; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .sub-box { background: #0b1329; border: 1px solid #1e2952; padding: 12px; border-radius: 8px; text-align: center; }
        .sub-box h4 { font-size: 11px; color: #94a3b8; margin-bottom: 5px; }
        .sub-box p { font-size: 14px; color: #34d399; font-weight: bold; }
        .my-horizontal { display: flex; justify-content: space-around; background: #0b1329; border: 1px solid #1e2952; padding: 15px; border-radius: 8px; margin-top: 15px; text-align: center; cursor: pointer; }
        .my-horizontal div { flex: 1; font-size: 12px; color: #38bdf8; font-weight: bold; }
        .series-title { color: #38bdf8; font-size: 16px; margin: 20px 15px 8px 15px; font-weight: bold; border-left: 4px solid #0284c7; padding-left: 8px; }
        .series-grid { display: flex; overflow-x: auto; gap: 12px; padding: 0 15px 10px 15px; scroll-snap-type: x mandatory; }
        .series-card { min-width: 210px; max-width: 210px; background: #101935; border: 1px solid #1e2952; border-radius: 12px; padding: 14px; scroll-snap-align: start; flex-shrink: 0; }
    </style>
</head>
<body>
    <header>
        <h1 id="header-title">Hut 9</h1>
        <div id="header-balance" style="font-size: 13px; color: #34d399; font-weight: bold;"></div>
    </header>
    <div id="main-container"></div>
    <nav class="bottom-nav" id="bottom-nav" style="display: none;">
        <button class="nav-item active" onclick="switchTab('home', this)"><span>🏠</span>Home</button>
        <button class="nav-item" onclick="switchTab('raffle', this)"><span>🎁</span>Raffle</button>
        <button class="nav-item" onclick="switchTab('chat', this)"><span>💬</span>Chat</button>
        <button class="nav-item" onclick="switchTab('ai', this)"><span>🤖</span>AI</button>
        <button class="nav-item" onclick="switchTab('income', this)"><span>📊</span>Income</button>
        <button class="nav-item" onclick="switchTab('my', this)"><span>👤</span>My</button>
    </nav>
    <script>
        let currentUser = JSON.parse(localStorage.getItem('hut9_active_user')) || null;
        const machines = [
            { id: 'k1', series: 'K-SERIES', name: 'K1 Mining Unit', price: 35000, payout: 3000, cycle: 18 },
            { id: 'k2', series: 'K-SERIES', name: 'K2 Mining Unit', price: 65000, payout: 5500, cycle: 18 },
            { id: 'k3', series: 'K-SERIES', name: 'K3 Mining Unit', price: 100000, payout: 11000, cycle: 18 },
            { id: 'k4', series: 'K-SERIES', name: 'K4 Mining Unit', price: 200000, payout: 20000, cycle: 18 },
            { id: 'd1', series: 'D-SERIES', name: 'D1 Mining Unit', price: 100000, payout: 20000, cycle: 15 }, 
            { id: 'd2', series: 'D-SERIES', name: 'D2 Mining Unit', price: 300000, payout: 35000, cycle: 15 },
            { id: 'd3', series: 'D-SERIES', name: 'D3 Mining Unit', price: 500000, payout: 50000, cycle: 15 },
            { id: 'd4', series: 'D-SERIES', name: 'D4 Mining Unit', price: 1000000, payout: 95000, cycle: 15 },
            { id: 'g1', series: 'G-SERIES', name: 'G1 Power Rig', price: 180000, payout: 10000, cycle: 30 },
            { id: 'g2', series: 'G-SERIES', name: 'G2 Power Rig', price: 300000, payout: 28000, cycle: 30 },
            { id: 'g3', series: 'G-SERIES', name: 'G3 Power Rig', price: 500000, payout: 35000, cycle: 30 },
            { id: 'g4', series: 'G-SERIES', name: 'G4 Power Rig', price: 850000, payout: 50000, cycle: 30 },
            { id: 'z1', series: 'Z-SERIES', name: 'Z1 Quantum Rig', price: 200000, payout: 20000, cycle: 20 },
            { id: 'z2', series: 'Z-SERIES', name: 'Z2 Quantum Rig', price: 350000, payout: 34000, cycle: 20 },
            { id: 'z3', series: 'Z-SERIES', name: 'Z3 Quantum Rig', price: 500000, payout: 41000, cycle: 20 },
            { id: 'z4', series: 'Z-SERIES', name: 'Z4 Quantum Rig', price: 850000, payout: 60000, cycle: 20 },
            { id: 'v1', series: 'VIP-SERIES', name: 'VIP 1 Miner', price: 500000, payout: 140000, cycle: 7 },
            { id: 'v2', series: 'VIP-SERIES', name: 'VIP 2 Miner', price: 890000, payout: 180000, cycle: 7 },
            { id: 'v3', series: 'VIP-SERIES', name: 'VIP 3 Miner', price: 1200000, payout: 245000, cycle: 7 },
            { id: 'v4', series: 'VIP-SERIES', name: 'VIP 4 Miner', price: 2500000, payout: 360000, cycle: 7 }
        ];

        window.onload = () => initApp();

        function generateCode() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let code = 'HUT9-';
            for (let i = 0; i < 6; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
            return code;
        }

        function initApp() {
            const nav = document.getElementById('bottom-nav');
            const balanceEl = document.getElementById('header-balance');
            if (!currentUser) {
                nav.style.display = 'none';
                balanceEl.innerText = '';
                renderLogin();
            } else {
                nav.style.display = 'flex';
                balanceEl.innerText = `UGX ${(currentUser.balance || 0).toLocaleString()}`;
                if (!currentUser.inviteCode) { currentUser.inviteCode = generateCode(); saveUserData(); }
                switchTab('home', document.querySelector('.nav-item'));
            }
        }

        function saveUserData() {
            localStorage.setItem('hut9_active_user', JSON.stringify(currentUser));
            let users = JSON.parse(localStorage.getItem('hut9_users_db')) || [];
            let index = users.findIndex(u => u.phone === currentUser.phone);
            if (index !== -1) { users[index] = currentUser; localStorage.setItem('hut9_users_db', JSON.stringify(users)); }
            document.getElementById('header-balance').innerText = `UGX ${currentUser.balance.toLocaleString()}`;
        }
        function renderLogin() {
            document.getElementById('header-title').innerText = 'Hut 9 - Access';
            document.getElementById('main-container').innerHTML = `
                <div class="card" style="max-width: 400px; margin: 40px auto;">
                    <h2 style="color: #38bdf8; text-align: center;">Welcome Back</h2>
                    <label>Phone Number</label><input type="text" id="login-phone" placeholder="Enter phone">
                    <label>Password</label><input type="password" id="login-pass" placeholder="Enter password">
                    <button class="btn" onclick="handleLogin()">Login</button>
                    <button class="btn" style="background: transparent; border: 1px solid #1e2952; color: #38bdf8;" onclick="renderRegister()">Create Account</button>
                </div>`;
        }

        function renderRegister() {
            document.getElementById('header-title').innerText = 'Hut 9 - Register';
            document.getElementById('main-container').innerHTML = `
                <div class="card" style="max-width: 400px; margin: 40px auto;">
                    <h2 style="color: #38bdf8; text-align: center;">Register</h2>
                    <label>Full Name</label><input type="text" id="reg-name" placeholder="Enter name">
                    <label>Phone Number</label><input type="text" id="reg-phone" placeholder="Enter phone">
                    <label>Password</label><input type="password" id="reg-pass" placeholder="Create password">
                    <button class="btn btn-success" onclick="handleRegister()">Register Account</button>
                    <button class="btn" style="background: transparent; border: 1px solid #1e2952; color: #38bdf8;" onclick="renderLogin()">Back to Login</button>
                </div>`;
        }

        function handleRegister() {
            const name = document.getElementById('reg-name').value;
            const phone = document.getElementById('reg-phone').value;
            const pass = document.getElementById('reg-pass').value;
            if (!name || !phone || !pass) { alert('Please fill in all fields.'); return; }
            let users = JSON.parse(localStorage.getItem('hut9_users_db')) || [];
            if (users.some(u => u.phone === phone)) { alert('Account already exists!'); renderLogin(); return; }
            currentUser = { name, phone, pass, balance: 15000, rigs: [], deposits: [], withdrawals: [], inviteCode: generateCode() };
            users.push(currentUser);
            localStorage.setItem('hut9_users_db', JSON.stringify(users));
            localStorage.setItem('hut9_active_user', JSON.stringify(currentUser));
            alert('Registration successful! UGX 15,000 bonus added.');
            initApp();
        }

        function handleLogin() {
            const phone = document.getElementById('login-phone').value;
            const pass = document.getElementById('login-pass').value;
            let users = JSON.parse(localStorage.getItem('hut9_users_db')) || [];
            const foundUser = users.find(u => u.phone === phone && u.pass === pass);
            if (foundUser) {
                currentUser = foundUser;
                if(!currentUser.rigs) currentUser.rigs = [];
                if(!currentUser.deposits) currentUser.deposits = [];
                if(!currentUser.withdrawals) currentUser.withdrawals = [];
                if(!currentUser.inviteCode) currentUser.inviteCode = generateCode();
                localStorage.setItem('hut9_active_user', JSON.stringify(currentUser));
                initApp();
            } else { alert('Invalid credentials.'); }
        }

        function switchTab(tabName, element) {
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            if (element) element.classList.add('active');
            const container = document.getElementById('main-container'), title = document.getElementById('header-title');

            if (tabName === 'home') {
                title.innerText = 'Hut 9 Dashboard';
                let totalDep = currentUser.deposits?.reduce((sum, d) => sum + d.amount, 0) || 0;
                let totalWit = currentUser.withdrawals?.reduce((sum, w) => sum + w.amount, 0) || 0;
                let aiInc = currentUser.rigs?.reduce((sum, r) => sum + (r.payout * r.cycle), 0) || 0;
                let dailyEarn = currentUser.rigs?.reduce((sum, r) => sum + r.payout, 0) || 0;

                container.innerHTML = `
                    <div class="card" style="padding: 10px; text-align: center;">
                        <img src="https://images.unsplash.com/photo-1592982537447-7440770cbfc9?auto=format&fit=crop&w=600&q=80" style="width:100%; height:140px; object-fit:cover; border-radius:8px;" alt="Tractors">
                    </div>
                    <div class="card">
                        <h3 style="color:#38bdf8; margin-bottom:10px;">Portfolio Metrics</h3>
                        <div class="grid-2">
                            <div class="sub-box"><h4>Deposit details</h4><p>UGX ${totalDep.toLocaleString()}</p></div>
                            <div class="sub-box"><h4>Withdraw details</h4><p>UGX ${totalWit.toLocaleString()}</p></div>
                            <div class="sub-box"><h4>Ai income</h4><p>UGX ${aiInc.toLocaleString()}</p></div>
                            <div class="sub-box"><h4>Daily earnings</h4><p>UGX ${dailyEarn.toLocaleString()}</p></div>
                        </div>
                    </div>`;
            } else if (tabName === 'raffle') {
                title.innerText = 'Lucky Raffle';
                container.innerHTML = `
                    <div class="card" style="text-align:center;">
                        <h3>Spin & Win (Cost: UGX 2,000)</h3>
                        <div id="spin-result" style="font-size:16px;margin:15px 0;color:#34d399;">Ready?</div>
                        <button class="btn" onclick="spinWheel()">Spin</button>
                    </div>`;
            } else if (tabName === 'chat') {
                title.innerText = 'Support Chat';
                container.innerHTML = `
                    <div class="card" style="text-align:center; padding: 40px 20px;">
                        <h3 style="color:#38bdf8; margin-bottom:15px;">Connect with us on Telegram</h3>
                        <p style="font-size:13px; color:#cbd5e1; margin-bottom:20px;">Tap the Telegram logo below to join our official community channel.</p>
                        <a href="https://t.me/hut9uganda" target="_blank" style="display:inline-block; background:#229ED9; color:#fff; padding:15px 30px; border-radius:50px; text-decoration:none; font-weight:bold; font-size:16px;">💬 Open Telegram Channel</a>
                    </div>`;
            } else if (tabName === 'ai') {
                title.innerText = 'AI Mining Series';
                let htmlContent = '';
                ['D-SERIES', 'G-SERIES', 'Z-SERIES', 'VIP-SERIES'].forEach(seriesName => {
                    htmlContent += `<div class="series-title">${seriesName}</div><div class="series-grid">`;
                    machines.filter(m => m.series === seriesName).forEach(m => {
                        let totalIncome = m.payout * m.cycle;
                        htmlContent += `
                            <div class="series-card">
                                <h3 style="color:#38bdf8; font-size:14px;">${m.name}</h3>
                                <p style="font-size:11px;color:#cbd5e1;margin-top:4px;">Price: UGX ${m.price.toLocaleString()}</p>
                                <p style="font-size:11px;color:#cbd5e1;">Cycle: ${m.cycle} Days</p>
                                <p style="font-size:11px;color:#34d399;">Daily: UGX ${m.payout.toLocaleString()}</p>
                                <p style="font-size:11px;color:#38bdf8;font-weight:bold;">Total: UGX ${totalIncome.toLocaleString()}</p>
                                <button class="btn" onclick="rentRig('${m.id}')">Rent</button>
                            </div>`;
                    });
                    htmlContent += `</div>`;
                });
                container.innerHTML = htmlContent;
            } else if (tabName === 'income') {
                title.innerText = 'Income Overview';
                if (!currentUser.rigs || currentUser.rigs.length === 0) {
                    container.innerHTML = `<div class="card" style="text-align:center; padding: 30px;"><h3 style="color:#38bdf8;">No Active Machines</h3><p style="font-size:13px;color:#cbd5e1;margin-top:10px;">Rent a mining rig from the AI tab to start earning daily automated income!</p></div>`;
                    return;
                }
                let htmlContent = `<div class="card"><h3 style="color:#38bdf8; margin-bottom:10px;">Active Rigs & Progress</h3>`;
                const now = new Date().getTime();
                currentUser.rigs.forEach(r => {
                    const rentedTime = new Date(r.rentedAt || now).getTime();
                    const diffDays = Math.max(0, Math.floor((now - rentedTime) / (1000 * 60 * 60 * 24)));
                    const daysActive = Math.min(r.cycle, diffDays);
                    const currentEarned = daysActive * r.payout;
                    const daysRemaining = Math.max(0, r.cycle - daysActive);

                    htmlContent += `
                        <div style="background:#0b1329; border:1px solid #1e2952; padding:12px; border-radius:8px; margin-top:10px;">
                            <h4 style="color:#38bdf8; font-size:14px;">${r.name}</h4>
                            <p style="font-size:12px; color:#cbd5e1; margin-top:4px;">Daily Payout: <span style="color:#34d399;">UGX ${r.payout.toLocaleString()}</span></p>
                            <p style="font-size:12px; color:#cbd5e1;">Days Elapsed: <span style="color:#fff; font-weight:bold;">${daysActive} / ${r.cycle} Days</span></p>
                            <p style="font-size:12px; color:#cbd5e1;">Days Remaining: <span style="color:#f59e0b; font-weight:bold;">${daysRemaining} Days</span></p>
                            <p style="font-size:12px; color:#38bdf8; font-weight:bold; margin-top:4px;">Accumulated: UGX ${currentEarned.toLocaleString()}</p>
                        </div>`;
                });
                htmlContent += `</div>`;
                container.innerHTML = htmlContent;
            } else if (tabName === 'my') {
                title.innerText = 'My Dashboard';
                container.innerHTML = `
                    <div class="card">
                        <h3 style="color:#38bdf8;text-align:center;">${currentUser.name}</h3>
                        <p style="text-align:center;color:#34d399;font-weight:bold;margin-bottom:15px;">UGX ${currentUser.balance.toLocaleString()}</p>
                        <div class="my-horizontal">
                            <div onclick="renderSubMenu('deposit')">Deposit</div>
                            <div onclick="renderSubMenu('withdraw')">Withdraw</div>
                            <div onclick="renderSubMenu('invite')">Invite</div>
                            <div onclick="renderSubMenu('settings')">Settings</div>
                        </div>
                        <button class="btn btn-danger" style="margin-top:25px;" onclick="logout()">Logout</button>
                    </div>`;
            }
        }

        let intervalId = null;
        function renderSubMenu(sub) {
            if (intervalId) clearInterval(intervalId);
            const container = document.getElementById('main-container'), title = document.getElementById('header-title');

            if (sub === 'deposit') {
                title.innerText = 'Deposit';
                container.innerHTML = `
                    <div class="card">
                        <button class="btn" style="background:transparent;border:1px solid #1e2952;color:#38bdf8;margin-bottom:10px;" onclick="switchTab('my', document.querySelectorAll('.nav-item')[5])">← Back</button>
                        <label>Phone Number</label><input type="text" id="dep-phone" value="${currentUser.phone}">
                        <label>Amount (UGX)</label><input type="number" id="dep-amt" placeholder="Enter amount">
                        <button class="btn btn-success" onclick="goToPaymentPage()">CONTINUE</button>
                    </div>`;
                } else if (sub === 'withdraw') {
        title.innerText = 'Withdraw';
        container.innerHTML = `
            <div class="card">
                <label>Phone Number</label><input type="text" id="withdraw-phone" placeholder="+256XXXXXXXXX">
                <label>Amount (UGX)</label><input type="number" id="withdraw-amt" placeholder="Enter amount">
                <button class="btn btn-danger" onclick="submitWithdrawal()">Submit Withdraw</button>
            </div>`;

            } else if (sub === 'invite') {
                title.innerText = 'Invite Friends';
                const link = `https://hut9.onrender.com/?ref=${currentUser.inviteCode}`;
                container.innerHTML = `
                    <div class="card" style="text-align:center;">
                        <button class="btn" style="background:transparent;border:1px solid #1e2952;color:#38bdf8;margin-bottom:10px;" onclick="switchTab('my', document.querySelectorAll('.nav-item')[5])">← Back</button>
                        <label>Your Code</label><input type="text" readonly value="${currentUser.inviteCode}" style="text-align:center;color:#34d399;">
                        <label>Link</label><input type="text" readonly value="${link}" style="text-align:center;font-size:10px;">
                        <button class="btn btn-success" onclick="navigator.clipboard.writeText('${link}');alert('Copied!');">Copy Link</button>
                    </div>`;
            } else if (sub === 'settings') {
    title.innerText = 'Settings';
    container.innerHTML = `
        <div class="card">
            <button class="btn" style="background: transparent; border: 1px solid #334155;"></button>
            <label>Name</label><input type="text" id="set-name" value="${currentUser.name || ''}" class="input">
            <button class="btn" onclick="updateProfile()">Save Profile</button>
        </div>
        <div class="card">
            <h3 style="color: #38bdf8; margin-bottom: 10px;">Admin Verification Panel</h3>
            <div id="admin-deposits-list">Loading pending deposits...</div>
        </div>
    `;
    setTimeout(loadAdminPanel, 100);
}

        }

let pendingDepositAmount = 0;
let pendingUserPhone = '';
async function submitWithdrawal() {
    const phone_number = document.getElementById('withdraw-phone').value.trim();
    const amount = document.getElementById('withdraw-amt').value;

    if (!phone_number || !amount) {
        alert('Please fill in all fields');
        return;
    }

    try {
        const response = await fetch('/api/auth/withdraw', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phone_number, amount })
        });
        
        const data = await response.json();
        if (response.ok && data.success) {
            alert('Withdrawal request submitted successfully!');
            document.getElementById('withdraw-phone').value = '';
            document.getElementById('withdraw-amt').value = '';
        } else {
            alert(data.error || 'Failed to submit withdrawal');
        }
    } catch (err) {
        console.error(err);
        alert('Network error submitting withdrawal');
    }
}
async function submitWithdrawal() {
    const phone_number = document.getElementById('withdraw-phone').value.trim();
    const amount = Number(document.getElementById('withdraw-amt').value);

    if (!phone_number || !amount || amount <= 0) {
        alert('Please fill in valid withdrawal details.');
        return;
    }

    if ((currentUser.balance || 0) < amount) {
        alert('Insufficient balance!');
        return;
    }

    try {
        const response = await fetch('/api/auth/withdraw', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phone_number, amount })
        });
        
        const data = await response.json();
        if (response.ok && data.success) {
            // Instantly deduct money from balance locally
            currentUser.balance = (currentUser.balance || 0) - amount;
            
            // Track total withdrawn for home metrics
            let currentTotalWithdraw = Number(localStorage.getItem('hut9_total_withdraw') || 0);
            localStorage.setItem('hut9_total_withdraw', currentTotalWithdraw + amount);

            // Save user data and update top bar balance display
            saveUserData();
            if (typeof updateBalanceDisplay === 'function') {
                updateBalanceDisplay();
            }

            // Update Home screen "Withdraw details" if element exists
            const withdrawDetailsEl = document.getElementById('withdraw-details-val');
            if (withdrawDetailsEl) {
                withdrawDetailsEl.innerText = `UGX ${(currentTotalWithdraw + amount).toLocaleString()}`;
            }

            alert('Withdrawal request submitted successfully!');
            document.getElementById('withdraw-phone').value = '';
            document.getElementById('withdraw-amt').value = '';
        } else {
            alert(data.error || 'Failed to submit withdrawal');
        }
    } catch (err) {
        console.error(err);
        alert('Network error submitting withdrawal');
    }
}

async function loadAdminWithdrawals() {
    try {
        const res = await fetch('/api/admin/withdrawals');
        const data = await res.json();
        const listDiv = document.getElementById('admin-withdrawals-list');
        if (!listDiv) return;

        if (!data.withdrawals || data.withdrawals.length === 0) {
            listDiv.innerHTML = '<p>No withdrawal requests.</p>';
            return;
        }

        let html = '<h4 style="color:#fff;">Pending Withdrawals</h4><table style="width:100%; color:#fff; font-size:12px;"><tr><th>Phone</th><th>Amount</th><th>Action</th></tr>';
        data.withdrawals.forEach(w => {
            html += `<tr>
                <td>${w.phone_number}</td>
                <td>${w.amount}</td>
                <td>
                    ${w.status === 'pending' ? `
                        <button onclick="handleWithdrawal(${w.id}, 'approve')" style="background:green; color:white; padding:2px 5px;">Approve</button>
                        <button onclick="handleWithdrawal(${w.id}, 'reject')" style="background:red; color:white; padding:2px 5px;">Reject</button>
                    ` : w.status}
                </td>
            </tr>`;
        });
        html += '</table>';
        listDiv.innerHTML = html;
    } catch (err) {
        console.error(err);
    }
}

async function handleWithdrawal(id, action) {
    try {
        const res = await fetch(`/api/admin/withdrawals/${id}/action`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action })
        });
        const data = await res.json();
        if (data.success) {
            alert(`Withdrawal ${action}d!`);
            loadAdminWithdrawals();
        } else {
            alert('Action failed');
        }
    } catch (err) {
        console.error(err);
    }
}

function goToPaymentPage() {
    const phone = document.getElementById('dep-phone').value.trim();
    const amt = parseInt(document.getElementById('dep-amt').value);

    if (!phone) {
        alert('Please enter your phone number.');
        return;
    }
    if (!amt || amt <= 0) {
        alert('Please enter a valid deposit amount.');
        return;
    }

    pendingUserPhone = phone;
    pendingDepositAmount = amt;

    const container = document.getElementById('main-container');
    document.getElementById('header-title').innerText = 'Make Payment';

    container.innerHTML = `
        <div class="card" style="text-align:center;">
            <h3 style="color:#38bdf8; margin-bottom:10px;">Send UGX ${amt.toLocaleString()}</h3>
            <p style="font-size:14px; color:#cbd5e1; margin-bottom:15px;">Copy one of the numbers below and send money via Mobile Money:</p>
            
            <div style="background:#0b1329; border:1px solid #334155; padding:12px; border-radius:8px; margin-bottom:15px;">
                <p style="font-size:18px; color:#34d399; font-weight:bold; margin:0;" id="pay-phone">0773539696</p>
                <p style="font-size:14px; color:#cbd5e1; margin:5px 0 0 0;" id="pay-name">NEMA KISA</p>
            </div>
            
            <label style="text-align:left; display:block; margin-top:10px;">Transaction ID / Message</label>
            <input type="text" id="trx-id" class="input" placeholder="Paste transaction ID here">
            
            <button class="btn btn-success" onclick="submitDepositRequest()" style="margin-top:15px;">Confirm & Submit Deposit</button>
        </div>
    `;
}

function submitDepositRequest() {
    const trxId = document.getElementById('trx-id').value.trim();
    if (!trxId) {
        alert('Please enter your Transaction ID.');
        return;
    }

    let allPendingDeposits = JSON.parse(localStorage.getItem('hut9_pending_deposits') || '[]');
    
    const depositEntry = {
        id: Date.now(),
        userPhone: pendingUserPhone,
        userName: currentUser.name || 'User',
        amount: pendingDepositAmount,
        trx: trxId,
        date: new Date().toLocaleString(),
        status: 'Pending'
    };

    allPendingDeposits.push(depositEntry);
    localStorage.setItem('hut9_pending_deposits', JSON.stringify(allPendingDeposits));

    alert(`Deposit of UGX ${pendingDepositAmount.toLocaleString()} submitted successfully for verification!`);
    switchTab('home', document.querySelectorAll('.nav-item')[0]);
}
function approveDeposit(depositId) {
    let allPendingDeposits = JSON.parse(localStorage.getItem('hut9_pending_deposits') || '[]');
    const index = allPendingDeposits.findIndex(d => d.id === depositId);

    if (index !== -1) {
        const dep = allPendingDeposits[index];
        dep.status = 'Approved';
        localStorage.setItem('hut9_pending_deposits', JSON.stringify(allPendingDeposits));

        // Update the target user's balance in stored users list
        let registeredUsers = JSON.parse(localStorage.getItem('hut9_users') || '[]');
        let userIndex = registeredUsers.findIndex(u => u.phone === dep.userPhone || u.phone_number === dep.userPhone);

        if (userIndex !== -1) {
            registeredUsers[userIndex].balance = (registeredUsers[userIndex].balance || 0) + dep.amount;
            localStorage.setItem('hut9_users', JSON.stringify(registeredUsers));
        }

        // Only update current balance if the logged-in user IS the depositor
        if (currentUser && (currentUser.phone === dep.userPhone || currentUser.phone_number === dep.userPhone)) {
            currentUser.balance = (currentUser.balance || 0) + dep.amount;
            saveUserData();
            if (typeof updateBalanceDisplay === 'function') {
                updateBalanceDisplay();
            }
        }

        // Track deposit details for the home screen metric
        let currentTotalDep = Number(localStorage.getItem('hut9_total_deposit') || 0);
        localStorage.setItem('hut9_total_deposit', currentTotalDep + dep.amount);

        alert(`Deposit of UGX ${dep.amount.toLocaleString()} for ${dep.userName} approved successfully!`);
        loadAdminPanel();
    }
}


async function loadAdminPanel() {
    const adminContainer = document.getElementById('admin-deposits-list');
    if (!adminContainer) return;

    // Change this to your exact admin phone number
    const ADMIN_PHONE = '0773539696';
    const userPhone = currentUser.phone || '';

    if (userPhone !== ADMIN_PHONE) {
        adminContainer.innerHTML = '<p style="color: #ef4444; text-align:center;">Access Denied: Admin Only</p>';
        return;
    }

    let html = '<h3 style="color:#38bdf8; margin-bottom:10px;">Admin Panel</h3>';

    // 1. Load Pending Deposits
    let allPendingDeposits = JSON.parse(localStorage.getItem('hut9_pending_deposits') || '[]');
    let pendingDeps = allPendingDeposits.filter(d => d.status === 'Pending');
    
    html += '<h4 style="color:#fff; margin-top:10px;">Pending Deposits</h4>';
    if (pendingDeps.length === 0) {
        html += '<p style="color: #94a3b8; font-size:12px;">No pending deposits.</p>';
    } else {
        pendingDeps.forEach(dep => {
            html += `<div style="background: #020617; padding: 12px; margin-bottom: 8px; border-radius: 6px;">
                <p style="color: #38bdf8; font-weight: bold; margin:0;">${dep.userName} (${dep.userPhone})</p>
                <p style="color: #cbd5e1; font-size: 14px; margin:2px 0;">Amount: UGX ${dep.amount.toLocaleString()}</p>
                <p style="color: #94a3b8; font-size: 12px; margin:0 0 8px 0;">TRX: ${dep.trx}</p>
                <button onclick="approveDeposit(${dep.id})" style="background: #22c55e; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor:pointer;">Approve Deposit</button>
            </div>`;
        });
    }

    // 2. Load Pending Withdrawals
    try {
        const res = await fetch('/api/admin/withdrawals');
        const data = await res.json();
        const pendingWithdrawals = (data.withdrawals || []).filter(w => w.status === 'pending');

        html += '<h4 style="color:#fff; margin-top:20px;">Pending Withdrawals</h4>';
        if (pendingWithdrawals.length === 0) {
            html += '<p style="color: #94a3b8; font-size:12px;">No pending withdrawals.</p>';
        } else {
            pendingWithdrawals.forEach(w => {
                html += `<div style="background: #020617; padding: 12px; margin-bottom: 8px; border-radius: 6px;">
                    <p style="color: #38bdf8; font-weight: bold; margin:0;">Phone: ${w.phone_number}</p>
                    <p style="color: #cbd5e1; font-size: 14px; margin:2px 0;">Amount: UGX ${w.amount.toLocaleString()}</p>
                    <div style="margin-top: 8px;">
                        <button onclick="handleWithdrawal(${w.id}, 'approve')" style="background: #22c55e; color: white; border: none; padding: 6px 10px; border-radius: 4px; margin-right: 5px; cursor:pointer;">Approve</button>
                        <button onclick="handleWithdrawal(${w.id}, 'reject')" style="background: #ef4444; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor:pointer;">Reject</button>
                    </div>
                </div>`;
            });
        }
    } catch (err) {
        html += '<p style="color: #ef4444; font-size:12px;">Error loading withdrawals.</p>';
    }

    adminContainer.innerHTML = html;
}



function rentRig(id) {
    const rig = machines.find(m => m.id == id);
    if (!rig) return;

    if ((currentUser.balance || 0) < rig.price) {
        alert('Insufficient balance! Please deposit to rent this machine.');
        return;
    }

    currentUser.balance -= rig.price;
    currentUser.rigs = currentUser.rigs || [];
    currentUser.rigs.push({ ...rig, rentedAt: new Date().toISOString() });
    
    saveUserData();
    alert(`Successfully rented ${rig.name}!`);
    switchTab('home', document.querySelectorAll('.nav-item')[0]);
}
function logout() {
    localStorage.removeItem('hut9_active_user');
    currentUser = null;
    alert('Logged out successfully!');
    initApp();
}

function updateProfile() {
    const nameInput = document.getElementById('set-name');
    const newName = nameInput ? nameInput.value.trim() : '';
    
    if (!newName) {
        alert('Please enter a valid name.');
        return;
    }
    
    currentUser.name = newName;
    saveUserData();
    alert('Profile updated successfully!');
    renderSubMenu('settings');
}
