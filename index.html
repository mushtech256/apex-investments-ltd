<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Investments Ltd</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0b1329;
            color: #ffffff;
            margin: 0;
            padding: 0;
            padding-bottom: 70px;
        }
        header {
            padding: 15px;
            font-size: 20px;
            font-weight: bold;
            background: #101935;
            border-bottom: 1px solid #1e2952;
        }
        .container {
            padding: 15px;
        }
        .nav-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .nav-tab {
            background: #101935;
            border: 1px solid #1e2952;
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            white-space-nowrap;
        }
        .nav-tab.active {
            background: #0284c7;
            border-color: #0284c7;
        }
        .machine-card {
            background: #101935;
            border: 1px solid #1e2952;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .machine-title {
            font-size: 16px;
            font-weight: bold;
            color: #38bdf8;
            margin-bottom: 8px;
        }
        .machine-detail {
            font-size: 14px;
            margin-bottom: 5px;
            color: #cbd5e1;
        }
        .rent-btn {
            display: block;
            width: 100%;
            background: #06b6d4;
            color: #000;
            font-weight: bold;
            text-align: center;
            padding: 12px;
            border-radius: 8px;
            border: none;
            margin-top: 12px;
            cursor: pointer;
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #0b1329;
            border-top: 1px solid #1e2952;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
        }
        .nav-item {
            color: #94a3b8;
            text-align: center;
            font-size: 12px;
            cursor: pointer;
        }
        .nav-item.active {
            color: #38bdf8;
        }
    </style>
</head>
<body>

    <header>AI Machines</header>

    <div class="container">
        <!-- Series Filter Tabs -->
        <div class="nav-tabs">
            <button class="nav-tab active" onclick="filterSeries('All')">All</button>
            <button class="nav-tab" onclick="filterSeries('H')">H</button>
            <button class="nav-tab" onclick="filterSeries('D')">D</button>
            <button class="nav-tab" onclick="filterSeries('G')">G</button>
            <button class="nav-tab" onclick="filterSeries('Z')">Z</button>
            <button class="nav-tab" onclick="filterSeries('VIP')">VIP</button>
        </div>

        <!-- Machines List -->
        <div id="machines-container"></div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
        <div class="nav-item">Home</div>
        <div class="nav-item">Raffle</div>
        <div class="nav-item">Chats</div>
        <div class="nav-item active">AI</div>
        <div class="nav-item">Income</div>
        <div class="nav-item">My</div>
    </div>

    <script>
        const machines = [
            { series: 'VIP', name: 'VIP 1 Elite Core (1X)', price: 'UGX 2,500,000', payout: 'UGX 250,000', cycle: '100 Days' },
            { series: 'VIP', name: 'VIP 2 Elite Core (2X)', price: 'UGX 4,000,000', payout: 'UGX 350,000', cycle: '100 Days' },
            { series: 'VIP', name: 'VIP 3 Elite Core (3X)', price: 'UGX 6,000,000', payout: 'UGX 1,000,000', cycle: '100 Days' },
            { series: 'VIP', name: 'VIP 4 Elite Core (4X)', price: 'UGX 8,000,000', payout: 'UGX 1,900,000', cycle: '100 Days' },
            { series: 'VIP', name: 'VIP 5 Elite Core (5X)', price: 'UGX 10,000,000', payout: 'UGX 2,500,000', cycle: '100 Days' }
        ];

        function renderMachines(filter) {
            const container = document.getElementById('machines-container');
            container.innerHTML = '';
            
            const filtered = filter === 'All' ? machines : machines.filter(m => m.series === filter);
            
            filtered.forEach(m => {
                container.innerHTML += `
                    <div class="machine-card">
                        <div class="machine-title">${m.name}</div>
                        <div class="machine-detail">Price: ${m.price}</div>
                        <div class="machine-detail" style="color: #38bdf8; font-weight: bold;">Daily Payout: ${m.payout}</div>
                        <div class="machine-detail">Cycle: ${m.cycle}</div>
                        <button class="rent-btn">Rent Machine</button>
                    </div>
                `;
            });
        }

        function filterSeries(series) {
            document.querySelectorAll('.nav-tab').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderMachines(series);
        }

        // Initial render
        renderMachines('VIP');
    </script>
</body>
</html>
