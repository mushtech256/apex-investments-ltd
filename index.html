<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUT 9 - Future AI Hardware</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #0b132b; color: #ffffff; padding-bottom: 70px; }
        
        /* Auth Screen */
        #auth-container { max-width: 400px; margin: 50px auto; padding: 20px; background: #1c2541; border-radius: 10px; }
        #auth-container h1 { text-align: center; margin-bottom: 20px; }
        .auth-tabs { display: flex; margin-bottom: 20px; }
        .auth-tabs button { flex: 1; padding: 10px; background: #3a506b; color: #fff; border: none; cursor: pointer; font-weight: bold; }
        .auth-tabs button.active { background: #00b4d8; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 14px; }
        .form-group input { width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #475569; background: #0b132b; color: #fff; }
        
        .auth-submit-btn { width: 100%; padding: 12px; background: #00b4d8; color: #fff; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 10px; }

        /* Main App & Navbar */
        #main-app-content { padding: 20px; display: none; }
        
        #bottomNavbar {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 60px;
    background: #1c2541;
    display: none; /* Stays hidden until login */
    flex-direction: row;
    justify-content: space-around;
    align-items: center;
    border-top: 1px solid #3a506b;
    z-index: 1000;
}
.nav-item {
    color: #94a3b8;
    text-decoration: none;
    font-size: 11px;
    font-weight: bold;
    text-align: center;
    cursor: pointer;
    flex: 1;
    padding: 8px 0;
    transition: color 0.2s;
}
.nav-item.active {
    color: #00b4d8;
}

        .nav-item { color: #fff; text-decoration: none; font-size: 12px; text-align: center; cursor: pointer; }
    </style>
</head>
<body>

    <!-- Authentication / Welcome Screen -->
    <div id="auth-container">
        <h1>Welcome</h1>
        <div class="auth-tabs">
            <button id="loginTabBtn" type="button" class="active" onclick="toggleAuthForm('login')">Login</button>
            <button id="registerTabBtn" type="button" onclick="toggleAuthForm('register')">Register</button>
        </div>

        <!-- Login Form -->
        <form id="loginForm" onsubmit="handleAuth(event, 'Login')">
            <div class="form-group">
                <label>Phone Number (+256...)</label>
                <input type="text" id="loginPhone" placeholder="07xxxxxxxx" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="Enter password" required>
            </div>
            <button type="submit" class="auth-submit-btn">Login to Dashboard</button>
        </form>

        <!-- Register Form -->
        <form id="registerForm" style="display: none;" onsubmit="handleAuth(event, 'Register')">
            <div class="form-group">
                <label>Phone Number (+256...)</label>
                <input type="text" id="regPhone" placeholder="07xxxxxxxx" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="regPassword" placeholder="Enter password" required>
            </div>
            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" id="regConfirmPassword" placeholder="Confirm password" required>
            </div>
            <button type="submit" class="auth-submit-btn">Create Account</button>
        </form>
    </div>

    <!-- Main App Dashboard Content (Hidden by default) -->
    <div id="main-app-content">
        <h2>Dashboard</h2>
        <p>Welcome to your AI computing platform!</p>
    </div>

    <!-- Bottom Navigation Bar (Hidden by default until login) -->
<div id="bottomNavbar">
    <a class="nav-item active" onclick="switchMainTab('home', this)">Home</a>
    <a class="nav-item" onclick="switchMainTab('raffle', this)">Raffle</a>
    <a class="nav-item" onclick="switchMainTab('chats', this)">Chats</a>
    <a class="nav-item" onclick="switchMainTab('ai', this)">AI</a>
    <a class="nav-item" onclick="switchMainTab('income', this)">Income</a>
    <a class="nav-item" onclick="switchMainTab('my', this)">My</a>
</div>


    <script>
        function toggleAuthForm(type) {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const loginTabBtn = document.getElementById('loginTabBtn');
            const registerTabBtn = document.getElementById('registerTabBtn');

            if (type === 'login') {
                if (loginForm) loginForm.style.display = 'block';
                if (registerForm) registerForm.style.display = 'none';
                if (loginTabBtn) loginTabBtn.classList.add('active');
                if (registerTabBtn) registerTabBtn.classList.remove('active');
            } else {
                if (loginForm) loginForm.style.display = 'none';
                if (registerForm) registerForm.style.display = 'block';
                if (loginTabBtn) loginTabBtn.classList.remove('active');
                if (registerTabBtn) registerTabBtn.classList.add('active');
            }
        }

        async function handleAuth(e, type) {
            e.preventDefault();

            const isLogin = type === 'Login';
            const phone = document.getElementById(isLogin ? 'loginPhone' : 'regPhone').value;
            const password = document.getElementById(isLogin ? 'loginPassword' : 'regPassword').value;

            if (!isLogin) {
                const confirmPassword = document.getElementById('regConfirmPassword').value;
                if (password !== confirmPassword) {
                    alert("Passwords do not match!");
                    return;
                }
            }

            try {
                const endpoint = isLogin ? '/api/auth/login' : '/api/auth/register';

const requestBody = isLogin 
    ? { phone_number: phone, password: password } 
    : { phone_number: phone, password: password, confirm_password: document.getElementById('regConfirmPassword').value };

const response = await fetch(endpoint, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(requestBody)
});


                const data = await response.json();

                if (!response.ok) {
                    alert(data.error || "Authentication failed!");
                    return;
                }

                alert(isLogin ? "Login successful!" : "Account created successfully!");

                // Hide Auth Screen & Unlock App + Navbar
                document.getElementById('auth-container').style.display = 'none';
                document.getElementById('main-app-content').style.display = 'block';
                
                const navbar = document.getElementById('bottomNavbar');
                if (navbar) {
                    navbar.style.display = 'flex';
                }

            } catch (err) {
                console.error(err);
                alert("Server error. Please try again.");
            }
        }

        const aiMachinesData = [
    // H-SERIES
    { id: 'H1', series: 'H', name: 'H1 Tractor Machine', price: 30000, daily: 3000, days: 30, total: 3000 * 30 },
    { id: 'H2', series: 'H', name: 'H2 Tractor Machine', price: 100000, daily: 10000, days: 30, total: 10000 * 30 },
    { id: 'H3', series: 'H', name: 'H3 Tractor Machine', price: 250000, daily: 21000, days: 30, total: 21000 * 30 },
    { id: 'H4', series: 'H', name: 'H4 Tractor Machine', price: 300000, daily: 28000, days: 30, total: 28000 * 30 },
    { id: 'H5', series: 'H', name: 'H5 Tractor Machine', price: 500000, daily: 35000, days: 30, total: 35000 * 30 },

    // D-SERIES
    { id: 'D1', series: 'D', name: 'D1 Mining Unit', price: 150000, daily: 50000, days: 15, total: 50000 * 15 },
    { id: 'D2', series: 'D', name: 'D2 Mining Unit', price: 350000, daily: 75000, days: 15, total: 75000 * 15 },
    { id: 'D3', series: 'D', name: 'D3 Mining Unit', price: 600000, daily: 100000, days: 15, total: 100000 * 15 },
    { id: 'D4', series: 'D', name: 'D4 Mining Unit', price: 800000, daily: 150000, days: 15, total: 150000 * 15 },
    { id: 'D5', series: 'D', name: 'D5 Mining Unit', price: 1000000, daily: 200000, days: 15, total: 200000 * 15 },

    // G-SERIES (Standard High-Performance)
    { id: 'G1', series: 'G', name: 'G1 Grid Unit', price: 200000, daily: 15000, days: 20, total: 15000 * 20 },
    { id: 'G2', series: 'G', name: 'G2 Grid Unit', price: 400000, daily: 32000, days: 20, total: 32000 * 20 },
    { id: 'G3', series: 'G', name: 'G3 Grid Unit', price: 700000, daily: 60000, days: 20, total: 60000 * 20 },
    { id: 'G4', series: 'G', name: 'G4 Grid Unit', price: 950000, daily: 85000, days: 20, total: 85000 * 20 },
    { id: 'G5', series: 'G', name: 'G5 Grid Unit', price: 1200000, daily: 110000, days: 20, total: 110000 * 20 },

    // Z-SERIES
    { id: 'Z1', series: 'Z', name: 'Z1 Quantum Rig', price: 500000, daily: 50000, days: 7, total: 50000 * 7 },
    { id: 'Z2', series: 'Z', name: 'Z2 Quantum Rig', price: 850000, daily: 150000, days: 7, total: 150000 * 7 },
    { id: 'Z3', series: 'Z', name: 'Z3 Quantum Rig', price: 1000000, daily: 400000, days: 7, total: 400000 * 7 },
    { id: 'Z4', series: 'Z', name: 'Z4 Quantum Rig', price: 1500000, daily: 450000, days: 7, total: 450000 * 7 },
    { id: 'Z5', series: 'Z', name: 'Z5 Quantum Rig', price: 2000000, daily: 500000, days: 7, total: 500000 * 7 },

    // VIP SERIES
    { id: 'V1', series: 'VIP', name: 'VIP 1 Elite Core', price: 2500000, daily: 25000, days: 100, total: 25000 * 100 },
    { id: 'V2', series: 'VIP', name: 'VIP 2 Elite Core', price: 4000000, daily: 35000, days: 100, total: 35000 * 100 },
    { id: 'V3', series: 'VIP', name: 'VIP 3 Elite Core', price: 6000000, daily: 100000, days: 100, total: 100000 * 100 },
    { id: 'V4', series: 'VIP', name: 'VIP 4 Elite Core', price: 8000000, daily: 190000, days: 100, total: 190000 * 100 },
    { id: 'V5', series: 'VIP', name: 'VIP 5 Elite Core', price: 10000000, daily: 250000, days: 100, total: 250000 * 100 }
];

function switchMainTab(tabName, element) {
    const navItems = document.querySelectorAll('.nav-item');
    navItems.forEach(item => item.classList.remove('active'));
    if (element) element.classList.add('active');

    const mainContent = document.getElementById('main-app-content');
    
    if (tabName === 'ai') {
        renderAiDashboard('All');
    } else {
        mainContent.innerHTML = `<h2>${tabName.toUpperCase()} Dashboard</h2><p>Welcome to your ${tabName} section.</p>`;
    }
}

function renderAiDashboard(filterSeries) {
    const mainContent = document.getElementById('main-app-content');
    
    const seriesList = ['All', 'H', 'D', 'G', 'Z', 'VIP'];
    
    let buttonsHtml = '<div style="display: flex; gap: 5px; overflow-x: auto; margin-bottom: 15px; padding-bottom: 5px;">';
    seriesList.forEach(s => {
        const activeStyle = filterSeries === s ? 'background: #00b4d8; color: #fff;' : 'background: #1c2541; color: #94a3b8;';
        const label = s === 'All' ? 'All' : `${s}-SERIES`;
        buttonsHtml += `<button onclick="renderAiDashboard('${s}')" style="padding: 8px 12px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; white-space: nowrap; ${activeStyle}">${label}</button>`;
    });
    buttonsHtml += '</div>';

    const filteredMachines = filterSeries === 'All' 
        ? aiMachinesData 
        : aiMachinesData.filter(m => m.series === filterSeries);

    let machinesHtml = '<div style="display: flex; flex-direction: column; gap: 12px;">';
    filteredMachines.forEach(m => {
        machinesHtml += `
            <div style="background: #1c2541; padding: 15px; border-radius: 8px; border: 1px solid #3a506b;">
                <h3 style="color: #00b4d8; margin-bottom: 5px;">${m.name}</h3>
                <p style="font-size: 13px; margin: 3px 0;">Price: <strong>UGX ${m.price.toLocaleString()}</strong></p>
                <p style="font-size: 13px; margin: 3px 0;">Daily Income: <strong style="color: #10b981;">UGX ${m.daily.toLocaleString()}</strong></p>
                <p style="font-size: 13px; margin: 3px 0;">Cycle Expiry: <strong>${m.days} Days</strong></p>
                <p style="font-size: 13px; margin: 3px 0;">Total Income: <strong style="color: #38bdf8;">UGX ${m.total.toLocaleString()}</strong></p>
                <button onclick="alert('Purchased ${m.name} successfully!')" style="width: 100%; margin-top: 10px; padding: 8px; background: #00b4d8; color: #white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer;">Rent Machine</button>
            </div>
        `;
    });
    machinesHtml += '</div>';

    mainContent.innerHTML = `<h2>AI Computing Machines</h2><p style="margin-bottom: 15px; font-size: 13px; color: #94a3b8;">Select a series to view available equipment.</p>` + buttonsHtml + machinesHtml;
}

}

    </script>
</body>
</html>
